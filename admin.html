<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración - Instituciones de Castilla</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f6fa; --surface:#fff; --text:#172b4d; --muted:#64748b; --accent:#123b66; --accent-2:#1e5b8f; --accent-soft:#e8f1fa; --border:#dbe4ee; --gold:#c8a34b; --danger:#9a3412; --ok:#166534; color-scheme:light; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:90px; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,"Segoe UI",Arial,sans-serif; line-height:1.5; }

  /* Barra superior */
  .top { position:sticky; top:0; z-index:50; background:linear-gradient(120deg,#102f50,#1c5886); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.12); }
  .top-in { max-width:1200px; margin:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 18px; }
  .top .marca { font-weight:800; white-space:nowrap; margin-right:6px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .tabs button { background:rgba(255,255,255,.1); color:#e8f1fa; border:1px solid rgba(255,255,255,.15); border-radius:9px; padding:9px 14px; font:inherit; font-size:.92rem; cursor:pointer; }
  .tabs button:hover { background:rgba(255,255,255,.18); }
  .tabs button.on { background:var(--gold); color:#1c170b; border-color:var(--gold); font-weight:700; }
  .top-acc button { background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:9px; padding:9px 12px; font:inherit; font-size:.88rem; cursor:pointer; }

  main { max-width:1200px; margin:0 auto; padding:24px 18px 60px; }
  .aviso { min-height:1.4em; margin:0 0 14px; font-size:.92rem; color:var(--danger); }
  .aviso.ok { color:var(--ok); }
  .titulo { font-size:1.5rem; margin:0 0 4px; color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 18px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:1.15rem; color:var(--accent); }
  .panel h3 { margin:20px 0 8px; font-size:.98rem; color:var(--accent-2); }
  .cab { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .cab h2 { margin:0; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  label { display:grid; gap:4px; font-size:.88rem; color:var(--muted); }
  input, select, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:9px 11px; width:100%; }
  textarea { min-height:80px; resize:vertical; }
  label.check { display:flex; align-items:center; gap:8px; color:var(--text); }
  label.check input { width:auto; }
  .acciones { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
  button { font:inherit; border:none; border-radius:999px; padding:8px 15px; cursor:pointer; background:var(--accent-soft); color:var(--accent-2); font-size:.88rem; }
  button.primario { background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=checkbox] { width:18px; height:18px; cursor:pointer; }
  button.peligro { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  button.mini { padding:5px 11px; font-size:.8rem; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .kpi b { display:block; font-size:1.7rem; color:var(--accent); }
  .kpi span { color:var(--muted); font-size:.9rem; }
  .tabla { overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { background:#f6f9fc; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .thumb { width:64px; height:44px; border-radius:7px; background:#dbe4ee center/cover no-repeat; display:block; }
  .badge { font-size:.75rem; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-2); }
  .badge.off { background:#f1f5f9; color:var(--muted); }
  .filtros { display:grid; grid-template-columns:260px 1fr auto; gap:12px; align-items:end; margin-bottom:14px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .thumbs img { width:110px; height:74px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#dbe4ee; }
  .fila-extra { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
  .nota { color:var(--muted); font-size:.88rem; margin:6px 0 0; }
  .vacio { color:var(--muted); font-style:italic; padding:14px 0; }
  .accesos { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .logo-top { display:flex; align-items:center; }
  .logo-top img { height:44px; width:auto; background:#fff; border-radius:10px; padding:4px 8px; display:block; }
  #tablaPersonal { max-height:70vh; overflow:auto; }
  .btn-archivo { display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border-radius:999px; padding:8px 15px; font-size:.88rem; font-weight:600; cursor:pointer; }
  .grid-tarjetas-adm { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .tarjeta-adm { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 6px 18px rgba(20,48,31,.05); }
  .tarjeta-adm-img { height:140px; background:#dbe4ee center/cover no-repeat; display:grid; place-items:center; color:#64748b; font-size:.85rem; }
  .tarjeta-adm-cuerpo { padding:14px; display:grid; gap:4px; }
  .tarjeta-adm-cuerpo b { color:var(--accent); }
  .tarjeta-adm-cuerpo small { color:var(--muted); }
  .tarjeta-adm-cuerpo .btns { margin-top:8px; }
  .tabla-det { table-layout:fixed; }
  .tabla-det th, .tabla-det td { padding:7px 10px; vertical-align:middle; }
  .tabla-det th:first-child { width:46%; }
  .tabla-det th.num, .tabla-det td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tabla-det input { width:100%; }
  .tabla-det input.num-in { text-align:right; }
  #tablaPersonal thead th { position:sticky; top:0; background:#f6f9fc; z-index:1; }
  @media(max-width:760px) { .filtros { grid-template-columns:1fr; } .fila-extra { grid-template-columns:1fr; } }

  /* Estilo inspirado en la página de hospedaje: verde profundo, dorado y crema */
  :root { --bg:#f7f5ef; --surface:#ffffff; --text:#172019; --muted:#667168; --accent:#16452a; --accent-2:#23643d; --accent-soft:#f4ead0; --border:#e4e7e1; --gold:#c8a34b; }
  body { font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .top { background:linear-gradient(120deg,#0f321e 0%,#23643d 100%); }
  .tabs button { border-radius:10px; }
  .tabs button.on { background:var(--gold); color:#1c170b; border-color:var(--gold); }
  .panel { border-radius:18px; box-shadow:0 10px 30px rgba(20,48,31,.07); }
  .panel h2, .titulo, .kpi b, .tarjeta-stat b { color:var(--accent); }
  .kpi, .tarjeta-stat { border-radius:18px; box-shadow:0 10px 30px rgba(20,48,31,.07); }
  .kpi b { font-size:2rem; letter-spacing:-.03em; }
  button.primario { background:var(--accent); }
  button.primario:hover { background:var(--accent-2); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--gold); border-color:transparent; }
  .badge { background:var(--accent-soft); color:var(--accent); }
  th { color:var(--accent-2); }
</style>
</head>

  // ---------- Carga ----------
  async function cargarTodo() {
    personalCache = null;
    if (tab === "personal") cargarPersonal();
    try {
      const [sd, si] = await Promise.all([db.collection("distritos").get(), db.collection("instituciones").get()]);

      instituciones = ordenarIE(si.docs.map(d => ({ id:d.id, ...d.data() })));

  // ---------- Historial de cambios ----------
  // Nota: como todavía no hay inicio de sesión, el historial registra QUÉ cambió
  // y CUÁNDO, pero no QUIÉN lo hizo. Eso se puede agregar cuando se implemente el login.
  async function registrarHistorial(entidad, accion, detalle, respaldo = null) {
    try {
      const reg = { entidad, accion, detalle, fecha: firebase.firestore.FieldValue.serverTimestamp() };
      if (respaldo) reg.respaldo = JSON.stringify(respaldo);
      await db.collection("historial").add(reg);
      historial = null; // se recarga la próxima vez que se visite la pestaña
    } catch (e) { /* no bloquear el guardado principal si falla el registro del historial */ }
  }

  async function cargarHistorial() {
    try {
      const snap = await db.collection("historial").orderBy("fecha", "desc").limit(200).get();
      historial = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      historial = [];
      aviso("No se pudo cargar el historial: " + e.message);
    }
    if (tab === "historial") pintarAdmin();
  }

  function formatoFecha(ts) {
    if (!ts) return "justo ahora";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString("es-PE", { dateStyle: "short", timeStyle: "short" });
  }

  // ---------- Navegación ----------
  function setTab(t) {
    if (formSucio && !confirm("Tienes cambios sin guardar en el formulario actual. ¿Deseas salir sin guardarlos?")) return;
    tab = t; editando = null; plan = null; formSucio = false;
    if (t === "historial" && historial === null) cargarHistorial();
    if (t === "personal" && personalCache === null) cargarPersonal();
    if (t === "portada" && portadaCfg === null) cargarPortadaAdm();
    pintarAdmin();
  }

  function pintarAdmin() {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
    const c = $("adB");
    if (tab === "inicio") c.innerHTML = vInicio();
    else if (tab === "distritos") c.innerHTML = editando?.tipo === "dist"
      ? formDist(distritos.find(d => d.clave === editando.clave)) : vDistritos();
    else if (tab === "instituciones") c.innerHTML = editando?.tipo === "ie"
      ? formIE(editando.id ? instituciones.find(x => x.id === editando.id) : null) : vInstituciones();
    else if (tab === "historial") c.innerHTML = vHistorial();
    else if (tab === "personal") { c.innerHTML = vPersonal(); pintarPersonal(); }
    else if (tab === "portada") c.innerHTML = vPortada();
    else c.innerHTML = vExcel();

    if (tab === "instituciones" && !editando) pintarListaIE();
    if (tab === "instituciones" && editando) pintarMiniaturas();
    if (editando) formSucio = false; // formulario recién pintado, todavía sin cambios
  }

  function initMapaForm() {
    const cont = document.getElementById("mapaForm");
    if (!cont || typeof L === "undefined") return;
    if (mapaForm) { mapaForm.remove(); mapaForm = null; markerForm = null; }
    const latI = document.querySelector('form[data-form="ie"] input[name="latitud"]');
    const lngI = document.querySelector('form[data-form="ie"] input[name="longitud"]');
    if (!latI || !lngI) return;
    const leer = el => parseFloat(String(el.value).replace(",", "."));
    const la = leer(latI), lo = leer(lngI);
    const tiene = !isNaN(la) && !isNaN(lo);
    const centro = tiene ? [la, lo] : [-16.0745, -72.4925];
    mapaForm = L.map(cont, { maxZoom: 19 }).setView(centro, tiene ? 17 : 16);
    const ESRI_F = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    const imagen = L.tileLayer(ESRI_F + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 16, attribution: "Tiles © Esri" });
    const etiquetas = L.tileLayer(ESRI_F + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 16 });
    const calles = L.tileLayer(ESRI_F + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 19, attribution: "Tiles © Esri" });
    const hibrido = L.layerGroup([imagen, etiquetas]);
    hibrido.addTo(mapaForm);
    L.control.layers({ "Satélite con calles": hibrido, "Satélite": imagen, "Calles": calles }, null, { position: "topright" }).addTo(mapaForm);
    L.control.scale({ imperial: false }).addTo(mapaForm);
    markerForm = L.marker(centro, { icon: pinAdm(), draggable: true, title: "Arrastra para mover" }).addTo(mapaForm);
    if (!tiene) markerForm.setOpacity(0.6);
    const fijar = ll => {
      latI.value = ll.lat.toFixed(6);
      lngI.value = ll.lng.toFixed(6);
      markerForm.setOpacity(1);
    };
    markerForm.on("dragend", () => fijar(markerForm.getLatLng()));
    mapaForm.on("click", e => { markerForm.setLatLng(e.latlng); fijar(e.latlng); });
    const desdeInputs = () => {
      const a = leer(latI), b = leer(lngI);
      if (!isNaN(a) && !isNaN(b)) { markerForm.setLatLng([a, b]); markerForm.setOpacity(1); mapaForm.panTo([a, b]); }
    };
    latI.addEventListener("change", desdeInputs);
    lngI.addEventListener("change", desdeInputs);
    setTimeout(() => mapaForm && mapaForm.invalidateSize(), 150);
  }

  // ---------- Utilidades de validación ----------
  function distKm(a1, o1, a2, o2) {
    const R = 6371, r = Math.PI / 180;
    const dA = (a2 - a1) * r, dO = (o2 - o1) * r;
    const h = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function normTxt(s) {
    return String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }
  function distEd(a, b) {
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  // Coincidencia aproximada: ignora acentos y tolera un error de escritura por palabra.
  function coincideBusqueda(campos, q) {
    const tokens = normTxt(q).split(" ").filter(Boolean);
    if (!tokens.length) return true;
    const texto = normTxt(campos.join(" "));
    const palabras = texto.split(" ").filter(Boolean);
    return tokens.every(t => texto.includes(t) ||
      palabras.some(w => t.length >= 4 && distEd(w.slice(0, t.length + 1), t) <= 1));
  }
  function copiaSinId(x) { const { id, ...resto } = x; return resto; }
  function respaldoDe(id) {
    const x = instituciones.find(i => i.id === id);
    return x ? { id, datos: copiaSinId(x) } : null;
  }
  function cumpleFiltroPend(x, v) {
    if (!v) return true;
    if (v === "sinCoords") return typeof x.latitud !== "number" || typeof x.longitud !== "number";
    if (v === "sinVerificar") return typeof x.latitud === "number" && !x.coordsVerificadas;
    if (v === "sinDirector") return !x.director;
    if (v === "sinFoto") return !(x.imagenes && x.imagenes.length);
    if (v === "sinCodigo") return !x.codigo;
    return true;
  }
  async function cambiarVerificacion(ids, valor) {
    if (!ids.length) { aviso("Selecciona primero las instituciones en la tabla."); return; }
    const respaldo = { items: ids.map(respaldoDe).filter(Boolean) };
    const batch = db.batch();
    ids.forEach(id => batch.update(db.collection("instituciones").doc(id), { coordsVerificadas: valor }));
    await batch.commit();
    registrarHistorial("Institución", valor ? "Coordenadas verificadas en lote" : "Verificación quitada en lote",
      `${ids.length} instituciones`, respaldo);
    seleccionIE.clear();
    aviso(`${ids.length} institución(es) ${valor ? "marcadas como verificadas" : "sin verificación"}.`, true);
    await cargarTodo();
  }
  async function deshacerCambio(h) {
    const rs = JSON.parse(h.respaldo);
    const batch = db.batch();
    const altas = [];
    rs.items.forEach(it => {
      if (instituciones.some(x => x.id === it.id)) batch.set(db.collection("instituciones").doc(it.id), it.datos);
      else altas.push(it.datos);
    });
    await batch.commit();
    for (const d of altas) await db.collection("instituciones").add(d);
    await db.collection("historial").doc(h.id).update({ deshecho: true });
    await registrarHistorial("Institución", "Cambio deshecho", h.detalle);
    await cargarTodo();
    await cargarHistorial();
    aviso("Cambio deshecho.", true);
  }

  function quitaTildes(s) {
    return String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }
  function sinCodigo(s) {
    return String(s ?? "").replace(/\(?\s*\b\d{4,6}\b\s*\)?/g, " ").replace(/\s+/g, " ").trim();
  }
  function dupAviso(d) {
    const n = quitaTildes(sinCodigo(d.nombre));
    const hit = instituciones.find(x => x.distrito === d.distrito && x.nombre !== d.nombre && (() => {
      const m = quitaTildes(sinCodigo(x.nombre));
      return m === n || (Math.min(m.length, n.length) >= 12 && (m.includes(n) || n.includes(m)));
    })());
    return hit ? ` <span style="color:var(--danger)">⚠ posible duplicado de «${esc(hit.nombre)}»</span>` : "";
  }

  // ---------- Fotos: subida a Firebase Storage y URLs ----------
  let storageAdm = null;
  function agregarFotoUrl(url) {
    const ta = document.querySelector("textarea[data-fotos]");
    if (!ta) return;
    ta.value = (ta.value.trim() ? ta.value.trimEnd() + "\n" : "") + url;
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function quitarFotoPorIndice(i) {
    const ta = document.querySelector("textarea[data-fotos]");
    if (!ta) return;
    const urls = ta.value.split(/[\n;,]/).map(x => x.trim()).filter(Boolean);
    urls.splice(i, 1);
    ta.value = urls.join("\n");
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function comprimirImagen(file, max = 1280) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error("No se pudo procesar la imagen")), "image/jpeg", 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("El archivo no es una imagen válida")); };
      img.src = url;
    });
  }
  async function subirFoto(file) {
    if (!storageAdm) storageAdm = firebase.storage();
    const blob = await comprimirImagen(file);
    const base = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]+/g, "_").slice(0, 60) || "foto";
    const ref = storageAdm.ref(`instituciones/${Date.now()}_${base}.jpg`);
    await ref.put(blob, { contentType: "image/jpeg" });
    return ref.getDownloadURL();
  }
  async function subirFotosSeleccionadas(files) {
    const estado = $("fotoEstado");
    let ok = 0;
    for (const [i, f] of [...files].entries()) {
      if (estado) estado.textContent = `Subiendo ${i + 1} de ${files.length}…`;
      try {
        agregarFotoUrl(await subirFoto(f));
        ok++;
      } catch (err) {
        aviso(`No se pudo subir "${f.name}": ${err.message}`);
      }
    }
    if (estado) estado.textContent = `${ok} de ${files.length} foto(s) subida(s).`;
    const form = document.querySelector('form[data-form="ie"]');
    if (form) formSucio = true;
  }

  // ---------- Excel ----------
  function vExcel() {
    return `
      <h1 class="titulo">Importar desde Excel</h1>
      <p class="sub">Sube un archivo para actualizar instituciones y distritos de una sola vez.</p>
      <div class="panel">
        <h2>Cómo funciona</h2>
        <p class="nota">Sube un archivo .xlsx o .xls. El lector es flexible: encuentra solo la fila de encabezados (aunque haya títulos arriba), reconoce muchos nombres de columna (Institución Educativa, Código Modular, Niveles, Ubicación/Referencia, Coordenadas, etc.), lee todas las hojas, acepta un distrito por hoja o por fila de título, y entiende coordenadas en decimal o en grados°minutos'segundos". Si falta el código, se toma del número que aparece en el nombre. Las columnas que no se reconocen se guardan como campos adicionales. Antes de guardar se muestra una vista previa con las correcciones automáticas. Las celdas vacías no borran datos existentes.</p>
        <div class="acciones">
          <input type="file" id="archivoExcel" accept=".xlsx,.xls,.csv" style="width:auto">
          <button type="button" data-a="plantilla">Descargar plantilla</button>
        </div>
        <div id="planBox" style="margin-top:14px"></div>
      </div>`;
  }

  // ======================= LECTOR DE EXCEL FLEXIBLE =======================
  const claveDeDistrito = (t, flexible = true) => {
    const n = norm(t).replace(/^(distrito_de_|distrito_|dist_de_|dist_)/, "");
    if (!n) return null;
    let d = DISTRITOS_BASE.find(x => norm(x.clave) === n || norm(x.nombre) === n);
    if (!d && flexible) {   // el distrito aparece como palabra dentro del texto (ej. "Aplao - Centro")
      const marco = "_" + n + "_";
      d = DISTRITOS_BASE.find(x => marco.includes("_" + norm(x.clave) + "_"));
    }
    return d ? d.clave : null;
  };

  const limpiar = v => typeof v === "string" ? v.replace(/[\u00a0\u200b]/g, " ").replace(/\s+/g, " ").trim() : v;
  const VACIOS = new Set(["", "-", "--", "---", "n/a", "na", "s/d", "sd", "sin dato", "sin datos", "no tiene", "ninguno", "ninguna", "null", "undefined"]);
  const esVacio = v => v === undefined || v === null || VACIOS.has(String(v).trim().toLowerCase());
  const IGNORAR_ENC = new Set(["n", "nro", "no", "num", "numero", "item", "orden", "correlativo", "id", "n_orden"]);

  // true si a y b difieren en a lo sumo 1 carácter (tolera errores de tipeo en encabezados)
  function dist1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1);
    return a.length > b.length ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
  }

  // Decide a qué campo del sistema corresponde un encabezado del Excel (o null si no se reconoce).
  function campoDeEncabezado(h) {
    const n = norm(h);
    if (!n || IGNORAR_ENC.has(n)) return null;
    if (ALIAS[n]) return ALIAS[n];
    if (n.length > 45) return null;               // un título largo no es un encabezado
    const t = re => re.test(n);
    if (t(/director|responsable|encargad/)) return "director";
    if (t(/alumno|estudiante|matricula|educando/)) return "estudiantes";
    if (t(/docente|profesor|maestro/)) return "docentes";
    if (t(/(^|_)lat(itud)?(_|$)/)) return "latitud";
    if (t(/(^|_)(lon|lng|long|longitud)(_|$)/)) return "longitud";
    if (t(/coordenada|(^|_)gps(_|$)|georreferen|geolocaliz/)) return "coordenadas";
    if (t(/altitud|altura|msnm|elevacion/)) return "altitud";
    if ((t(/(^|_)(cod|codigo)(_|$)/) || t(/modular/)) && !t(/local|ugel|ubigeo|plaza|poblado|anexo|nivel/)) return "codigo";
    if (t(/distrito|(^|_)dist(_|$)/) && !t(/institucion|colegio|escuela|centro_educativo/)) return "distrito";
    if (t(/nombre|denominacion|razon_social/)) return "nombre";
    if (t(/(^|_)(tipo|nivel|niveles|modalidad|forma)(_|$)/)) return "tipo";
    if (t(/institucion|centro_educativo|establecimiento|colegio|escuela|plantel|(^|_)(i_e|ie|iiee|ii_ee|iei|iep)(_|$)/) && !t(/anexo|localidad|poblado/)) return "nombre";
    if (t(/direccion|domicilio|ubicacion|referencia|localizacion|(^|_)lugar(_|$)/)) return "direccion";
    if (t(/(^|_)(zona|ambito|area)(_|$)/)) return "zona";
    if (t(/imagen|foto|enlace|(^|_)(url|link)(_|$)/)) return "imagenes";
    if (t(/informacion|observacion|descripcion|(^|_)(nota|notas|comentario|comentarios|detalle)(_|$)/)) return "info";
    for (const [k, v] of Object.entries(ALIAS)) if (k.length >= 6 && dist1(n, k)) return v;
    return null;
  }

  // ---- Coordenadas en varios formatos: decimal, coma decimal, grados°minutos'segundos", con S/W, en una sola celda ----
  function parseCoord(v) {
    if (esVacio(v)) return null;
    if (typeof v === "number") return v;
    const s = String(v).trim().toUpperCase().replace(/[−–—]/g, "-").replace(/,/g, ".").replace(/\s+/g, " ");
    const dms = s.match(/(-?\d{1,3})\s*[°º:]\s*(\d{1,2})\s*['’′:]\s*(\d{1,2}(?:\.\d+)?)?\s*(?:["”″]|'')?\s*([NSEWO])?/);
    if (dms) {
      let g = Math.abs(+dms[1]) + (+dms[2]) / 60 + (+(dms[3] || 0)) / 3600;
      if (+dms[1] < 0 || s.trim().startsWith("-") || /[SWO]/.test(dms[4] || "")) g = -g;
      return g;
    }
    const dec = s.match(/-?\d+(?:\.\d+)?/);
    if (!dec) return NaN;
    let n = parseFloat(dec[0]);
    const h = s.match(/([NSEWO])\s*$/) || s.match(/^([NSEWO])\s/);
    if (h && /[SWO]/.test(h[1]) && n > 0) n = -n;
    return n;
  }

  // "-16.0742, -72.4851" o dos coordenadas en grados/minutos/segundos dentro de una sola celda
  function parseParCoord(v) {
    const s = String(v ?? "").replace(/[−–—]/g, "-");
    const dm = s.match(/\d{1,3}\s*[°º]\s*\d{1,2}\s*['’′]\s*\d{1,2}(?:[.,]\d+)?\s*(?:["”″]|'')?\s*[NSEWO]?/gi);
    if (dm && dm.length >= 2) return [parseCoord(dm[0]), parseCoord(dm[1])];
    const m = s.match(/(-?\d{1,3}[.,]\d{3,})\s*[,;|\s]\s*(-?\d{1,3}[.,]\d{3,})/);
    return m ? [parseCoord(m[1]), parseCoord(m[2])] : null;
  }

  // Valida contra Castilla y corrige errores típicos: signo negativo faltante o latitud/longitud cruzadas.
  function resolverCoord(lat, lng) {
    const enLat = v => v >= LIM_CASTILLA.latMin && v <= LIM_CASTILLA.latMax;
    const enLng = v => v >= LIM_CASTILLA.lngMin && v <= LIM_CASTILLA.lngMax;
    const arreglar = (v, ok) => ok(v) ? v : (v > 0 && ok(-v) ? -v : null);
    const avisos = [];
    if (lat == null && lng == null) return { avisos };
    if (lat == null || lng == null) return { error: `solo trae ${lat == null ? "longitud" : "latitud"}; falta la otra coordenada` };
    let a = arreglar(lat, enLat), b = arreglar(lng, enLng);
    if (a !== null && b !== null) {
      if (a !== lat || b !== lng) avisos.push("se añadió el signo negativo a la coordenada");
      return { lat: a, lng: b, avisos };
    }
    a = arreglar(lng, enLat); b = arreglar(lat, enLng);
    if (a !== null && b !== null) { avisos.push("latitud y longitud estaban cruzadas; se intercambiaron"); return { lat: a, lng: b, avisos }; }
    return { error: `las coordenadas (${lat}, ${lng}) no parecen estar en Castilla` };
  }

  // Números: tolera "1,200", "1.200", "25 alumnos", "3,200 msnm"
  function parseNumero(v, entero) {
    if (esVacio(v)) return null;
    if (typeof v === "number") return entero ? Math.round(v) : v;
    const m = String(v).replace(/\s/g, "").match(/-?\d+(?:[.,]\d+)*/);
    if (!m) return NaN;
    let t = m[0];
    if (entero || /^-?\d{1,2}[.,]\d{3}$/.test(t)) t = t.replace(/[.,]/g, "");
    else t = t.replace(",", ".");
    return Number(t);
  }

  // Código dentro del nombre: "I.E. 40307 Ángela…" → 40307 (7 dígitos = código modular; 4-6 = N° de la IE; "N° 381")
  function extraerCodigo(nombre) {
    let m = nombre.match(/(?:^|\D)(\d{7})(?!\d)/); if (m) return m[1];
    m = nombre.match(/(?:^|\D)(\d{4,6})(?!\d)/); if (m) return m[1];
    m = nombre.match(/\bN\s*[°º.]*\s*(\d{1,7})(?!\d)/i); if (m) return m[1];
    return "";
  }

  // Nombre sin números ni siglas, para reconocer la misma IE escrita con/sin su número. "" si queda muy poco texto.
  function nombreSinNumero(s) {
    const t = norm(s).split("_").filter(p => p && !/^\d+$/.test(p) && !["i", "e", "ie", "iei", "iep", "n", "no"].includes(p)).join("_");
    return t.length >= 6 ? t : "";
  }

  // Lee una hoja: detecta la fila de encabezados (aunque haya títulos o filas en blanco arriba)
  function leerTabla(ws, reconoce) {
    const rango = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : { s: { r: 0 } };
    const crudo = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: true });
    const filas = crudo.map((f, i) => ({ n: i + 1 + rango.s.r, f: f.map(limpiar) })).filter(x => x.f.some(c => !esVacio(c)));
    let mejor = -1, puntaje = 0;
    for (let i = 0; i < Math.min(filas.length, 25); i++) {
      const rec = filas[i].f.filter(c => !esVacio(c) && reconoce(c)).length;
      const nv = filas[i].f.filter(c => !esVacio(c)).length;
      const p = (rec >= 2 || (rec >= 1 && nv >= 3)) ? rec : 0;
      if (p > puntaje) { puntaje = p; mejor = i; }
    }
    if (mejor < 0) return { sinEncabezado: true, primeras: filas.slice(0, 3).map(x => x.f.filter(c => !esVacio(c)).join(" | ")) };
    return {
      filaEnc: filas[mejor].n,
      enc: filas[mejor].f.map(c => String(c ?? "").trim()),
      filas: filas.slice(mejor + 1).map(x => ({ n: x.n, v: x.f, noVacias: x.f.filter(c => !esVacio(c)).length }))
    };
  }

  function separarFila(valores, cols) {
    const base = {}, extras = {};
    cols.forEach((c, j) => {
      const v = valores[j];
      if (esVacio(v)) return;
      if (c.campo && !(c.campo in base)) base[c.campo] = v;
      else if (c.h && !IGNORAR_ENC.has(norm(c.h))) extras[String(c.h).trim()] = String(v).trim();  // columna repetida o no reconocida
    });
    return { base, extras };
  }

  async function analizarArchivo(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const res = { nuevos: [], actualizar: [], sinCambios: 0, errores: [], avisos: 0, diagnostico: [], distritos: [] };
    const hojasD = wb.SheetNames.filter(s => norm(s) === "distritos");
    const hojasIE = wb.SheetNames.filter(s => !hojasD.includes(s));
    const multi = hojasIE.length > 1;

    // ---- Hoja de distritos (opcional) ----
    for (const nombreHoja of hojasD) {
      const tabla = leerTabla(wb.Sheets[nombreHoja], h => /^(clave|distrito|nombre|capital|anexos|activo|visible)$/.test(norm(h)));
      if (tabla.sinEncabezado) { res.diagnostico.push(`Hoja "${nombreHoja}": no se reconocieron encabezados; se omitió.`); continue; }
      tabla.filas.forEach(f => {
        const get = (...ns) => { const j = tabla.enc.findIndex(h => ns.includes(norm(h))); return j >= 0 && !esVacio(f.v[j]) ? String(f.v[j]).trim() : ""; };
        const clave = claveDeDistrito(get("clave") || get("distrito") || get("nombre"));
        if (!clave) { res.errores.push(`Hoja ${nombreHoja}, fila ${f.n}: distrito no reconocido`); return; }
        const d = { clave };
        if (get("nombre")) d.nombre = get("nombre");
        if (get("capital")) d.capital = get("capital");
        if (get("anexos")) d.anexos = get("anexos").split(/[\n;]/).map(s => s.trim()).filter(Boolean);
        const act = get("activo") || get("visible");
        if (act) d.activo = /^(si|sí|s|1|true|x)$/i.test(act);
        res.distritos.push(d);
      });
    }

    // ---- Hojas de instituciones (se leen todas las que tengan una columna de nombre) ----
    const vistos = new Set(), usados = new Set();
    for (const nombreHoja of hojasIE) {
      const tabla = leerTabla(wb.Sheets[nombreHoja], h => !!campoDeEncabezado(h));
      if (tabla.sinEncabezado) {
        res.diagnostico.push(`Hoja "${nombreHoja}": no se reconocieron encabezados. Primeras filas: ${tabla.primeras.join(" // ") || "(vacía)"}`);
        continue;
      }
      const cols = tabla.enc.map(h => ({ h, campo: campoDeEncabezado(h) }));

      // Si ninguna columna se llama "nombre", se busca la que parece contener nombres de colegios
      if (!cols.some(c => c.campo === "nombre")) {
        const re = /^(i\.?\s?e\.?|iei|iep|colegio|escuela|cetpro|instituto|jec|pronoei|cuna|jardin|centro educativo|cebe|ceba)/i;
        let mejorJ = -1, mejorR = 0.4;
        cols.forEach((c, j) => {
          if (c.campo) return;
          const vals = tabla.filas.map(f => f.v[j]).filter(x => typeof x === "string" && x);
          if (vals.length < 2) return;
          const r = vals.filter(x => re.test(x)).length / vals.length;
          if (r > mejorR) { mejorR = r; mejorJ = j; }
        });
        if (mejorJ >= 0) { cols[mejorJ].campo = "nombre"; res.diagnostico.push(`Hoja "${nombreHoja}": la columna "${cols[mejorJ].h}" se interpretó como nombre de la IE por su contenido.`); }
      }
      if (!cols.some(c => c.campo === "nombre")) {
        res.diagnostico.push(`Hoja "${nombreHoja}": no hay columna de nombre de institución (encabezados vistos: ${tabla.enc.filter(Boolean).join(", ")}); se omitió.`);
        continue;
      }
      const noRec = cols.filter(c => !c.campo && c.h && !IGNORAR_ENC.has(norm(c.h))).map(c => c.h);
      res.diagnostico.push(`Hoja "${nombreHoja}": encabezados en la fila ${tabla.filaEnc}. Reconocidos: ${cols.filter(c => c.campo).map(c => `${c.h} → ${c.campo}`).join(", ")}.${noRec.length ? " Se guardarán como campos adicionales: " + noRec.join(", ") + "." : ""}`);

      let distritoActual = claveDeDistrito(nombreHoja, false);   // una hoja por distrito
      let leidas = 0, sinNombre = 0;

      for (const fila of tabla.filas) {
        const etiqueta = multi ? `${nombreHoja} · ${fila.n}` : String(fila.n);

        // Fila de título de sección (ej. "DISTRITO DE ORCOPAMPA"): fija el distrito para las filas siguientes
        if (fila.noVacias === 1) {
          const unico = fila.v.find(c => !esVacio(c));
          const c = claveDeDistrito(unico, false);
          if (c) { distritoActual = c; continue; }
        }

        const { base, extras } = separarFila(fila.v, cols);
        if (!base.nombre) { if (fila.noVacias > 0) sinNombre++; continue; }
        leidas++;
        const nombre = String(base.nombre).trim();
        const avisos = [];

        // Distrito: de la columna, o (si está vacía por celdas combinadas) del anterior / de la hoja / de la sección
        let clave;
        if (base.distrito) {
          clave = claveDeDistrito(base.distrito);
          if (!clave) { res.errores.push(`Fila ${etiqueta} (${nombre}): distrito "${base.distrito}" no reconocido`); continue; }
          distritoActual = clave;
        } else {
          clave = distritoActual;
          if (!clave) { res.errores.push(`Fila ${etiqueta} (${nombre}): no se pudo saber el distrito (agrega una columna Distrito, o una hoja o fila de título por distrito)`); continue; }
        }

        const datos = { distrito: clave, nombre };
        for (const c of ["tipo", "direccion", "zona", "director", "info"]) if (base[c] !== undefined) datos[c] = String(base[c]).trim();

        // Coordenadas: columnas separadas, una sola celda "lat, lng", o dentro de la columna de ubicación
        let lat = parseCoord(base.latitud), lng = parseCoord(base.longitud);
        let par = base.coordenadas ? parseParCoord(base.coordenadas) : null;
        if (base.coordenadas && !par) avisos.push(`no se pudo interpretar "${base.coordenadas}" como coordenadas`);
        if (!par && datos.direccion && (lat == null || lng == null)) {
          const p = parseParCoord(datos.direccion);
          if (p) { par = p; if (/^[\s\d.,;|\-−°º'′"″NSEWO]+$/i.test(datos.direccion)) delete datos.direccion; }
        }
        if (par) { if (lat == null) lat = par[0]; if (lng == null) lng = par[1]; }
        if (Number.isNaN(lat) || Number.isNaN(lng)) { res.errores.push(`Fila ${etiqueta} (${nombre}): latitud/longitud no son números válidos ("${base.latitud ?? ""}", "${base.longitud ?? ""}")`); continue; }
        const rc = resolverCoord(lat, lng);
        if (rc.error) { res.errores.push(`Fila ${etiqueta} (${nombre}): ${rc.error}`); continue; }
        if (rc.lat != null) { datos.latitud = rc.lat; datos.longitud = rc.lng; }
        avisos.push(...rc.avisos);

        // Números
        let malNum = false;
        for (const c of ["estudiantes", "docentes", "altitud"]) {
          if (base[c] === undefined) continue;
          const n = parseNumero(base[c], c !== "altitud");
          if (n === null) continue;
          if (Number.isNaN(n)) { res.errores.push(`Fila ${etiqueta} (${nombre}): "${c}" debe ser numérico (vino "${base[c]}")`); malNum = true; break; }
          datos[c] = n;
        }
        if (malNum) continue;

        if (base.imagenes !== undefined) datos.imagenes = String(base.imagenes).split(/[\n;,]/).map(s => s.trim()).filter(Boolean);

        // Código: de su columna; si no hay, se toma del número que aparece en el nombre (el nombre se conserva igual)
        let codigo = base.codigo !== undefined ? String(base.codigo).trim().replace(/\.0+$/, "").replace(/\s+/g, "") : "";
        if (!codigo) { const x = extraerCodigo(nombre); if (x) { codigo = x; avisos.push(`código ${x} tomado del nombre`); } }
        if (codigo) datos.codigo = codigo;

        // ¿Ya existe en el sistema? (por código, por nombre exacto o por nombre sin su número)
        const sn = nombreSinNumero(nombre);
        const existente = (datos.codigo && instituciones.find(x => x.codigo && String(x.codigo) === datos.codigo))
          || instituciones.find(x => x.distrito === clave && norm(x.nombre) === norm(nombre))
          || (sn && instituciones.find(x => x.distrito === clave && nombreSinNumero(x.nombre) === sn));

        const llave = `${clave}|${norm(nombre)}`;
        if (vistos.has(llave) || (existente && usados.has(existente.id))) {
          res.errores.push(`Fila ${etiqueta} (${nombre}): está repetida dentro del archivo; se omitió`);
          continue;
        }
        vistos.add(llave);
        res.avisos += avisos.length;

        if (!existente) {
          datos.extras = Object.entries(extras).map(([campo, valor]) => ({ campo, valor }));
          res.nuevos.push({ datos, linea: etiqueta, avisos });
          continue;
        }
        usados.add(existente.id);

        const cambios = [];
        const nuevo = { ...existente };
        Object.entries(datos).forEach(([k, v]) => {
          if (JSON.stringify(existente[k] ?? null) !== JSON.stringify(v)) { cambios.push(k); nuevo[k] = v; }
        });
        const mapaExtras = {};
        (existente.extras || []).forEach(x => mapaExtras[x.campo] = x.valor);
        Object.entries(extras).forEach(([campo, valor]) => {
          if (mapaExtras[campo] !== valor) { cambios.push("extra: " + campo); mapaExtras[campo] = valor; }
        });
        nuevo.extras = Object.entries(mapaExtras).map(([campo, valor]) => ({ campo, valor }));

        if (!cambios.length) { res.sinCambios++; continue; }
        res.actualizar.push({ id: existente.id, nombre: existente.nombre, cambios, datos: nuevo, linea: etiqueta, avisos });
      }
      res.diagnostico.push(`Hoja "${nombreHoja}": ${leidas} institución(es) leída(s)${sinNombre ? `, ${sinNombre} fila(s) sin nombre omitida(s)` : ""}.`);
    }
    return res;
  }

  function mostrarPlan() {
    const p = plan;
    const av = a => (a && a.length) ? ` <span style="color:var(--gold)">⚠ ${esc(a.join("; "))}</span>` : "";
    const filas = [
      ...p.nuevos.map(n => `<tr><td>Nueva</td><td>${esc(n.linea)}</td><td>${esc(n.datos.nombre)}</td><td>${esc(n.datos.distrito)}${n.datos.codigo ? " · cód. " + esc(n.datos.codigo) : ""}${av(n.avisos)}${dupAviso(n.datos)}</td></tr>`),
      ...p.actualizar.map(a => `<tr><td>Actualizar</td><td>${esc(a.linea)}</td><td>${esc(a.nombre)}</td><td>${esc(a.cambios.join(", "))}${av(a.avisos)}</td></tr>`),
      ...(p.yaRegistradas || []).map(n => `<tr><td style="color:var(--muted)">Ya registrada</td><td></td><td>${esc(n)}</td><td>sin cambios</td></tr>`),
      ...p.errores.map(er => `<tr><td style="color:var(--danger)">Error</td><td colspan="3">${esc(er)}</td></tr>`)
    ];
    const puedeAplicar = p.nuevos.length || p.actualizar.length || p.distritos.length;
    $("planBox").innerHTML = `
      <h3>Vista previa</h3>
      <p class="nota">Nuevas: ${p.nuevos.length} · Actualizar: ${p.actualizar.length} · Sin cambios: ${p.sinCambios} · Errores: ${p.errores.length} · Avisos ⚠ (correcciones o códigos detectados): ${p.avisos} · Distritos a actualizar: ${p.distritos.length}</p>
      <details style="margin-top:8px"><summary style="cursor:pointer">Cómo se leyó el archivo</summary>
        <ul class="nota" style="margin:8px 0 0 18px">${p.diagnostico.map(d => `<li>${esc(d)}</li>`).join("") || "<li>Sin información.</li>"}</ul>
      </details>
      <div class="tabla" style="margin-top:10px"><table>
        <thead><tr><th>Acción</th><th>Fila</th><th>Institución</th><th>Detalle</th></tr></thead>
        <tbody>${filas.slice(0, 300).join("") || `<tr><td colspan="4">No se encontraron filas válidas. Abre "Cómo se leyó el archivo" para ver qué pasó.</td></tr>`}</tbody>
      </table></div>
      <div class="acciones">
        <button type="button" class="primario" data-a="excel-aplicar" ${puedeAplicar ? "" : "disabled"}>Aplicar importación</button>
        <button type="button" data-a="excel-cancelar">Cancelar</button>
      </div>`;
  }

  // ---------- Formato de archivos de la UGEL (personal por institución) ----------
  const NIVEL_ORDEN = ["Inicial", "Primaria", "Secundaria", "Básica Especial", "Básica Alternativa", "Técnico Productiva"];
  function arreglarTexto(v) {
    let t = String(v ?? "").replace(/_x000D_/g, " ").replace(/[\r\n]+/g, " ")
      .replace(/Ãƒâ€˜/g, "Ñ").replace(/Ã‘/g, "Ñ").replace(/Ã±/g, "ñ");
    for (let k = 0; k < 2; k++) { try { t = decodeURIComponent(escape(t)); } catch (e) { break; } }
    return t.replace(/\s+/g, " ").trim();
  }
  function extraerCodigoNombre(raw) {
    let s0 = arreglarTexto(raw);
    const m = s0.match(/\b(\d{7}|\d{5})\b/);
    const codigo = m ? m[1] : "";
    const nombre = s0.replace(/\b\d{5,7}\b/g, " ").replace(/["“”]/g, "").replace(/\s+/g, " ")
      .replace(/^[\s\-–:]+|[\s\-–:]+$/g, "").trim();
    return { nombre, codigo };
  }
  const coreDe = s => quitaTildes(s).split(" ").filter(t => t.length > 1 && !["ie", "iep", "iei", "nro", "no"].includes(t)).join(" ");
  function zonaNormal(z) {
    const t = quitaTildes(z);
    if (t.includes("urban")) return "Urbana";
    if (t.includes("rural")) return "Rural";
    return "";
  }
  function nivelNormal(n) {
    const t = quitaTildes(n);
    if (t.startsWith("inicial")) return "Inicial";
    if (t.startsWith("primaria")) return "Primaria";
    if (t.startsWith("secundaria")) return "Secundaria";
    if (t.startsWith("basica especial")) return "Básica Especial";
    if (t.startsWith("basica alternativa")) return "Básica Alternativa";
    if (t.startsWith("tecnico")) return "Técnico Productiva";
    return "";
  }
  function codigosDe(x) {
    const set = new Set();
    String(x.codigo || "").match(/\d{5,7}/g)?.forEach(c => set.add(c));
    String(x.nroIE || "").match(/\d{5,7}/g)?.forEach(c => set.add(c));
    (x.codigosModulares || []).forEach(c => String(c).match(/\d{5,7}/g)?.forEach(k => set.add(k)));
    (x.extras || []).forEach(e => {
      if (/N° de IE|codigo|código/i.test(e.campo || "")) String(e.valor || "").match(/\d{5,7}/g)?.forEach(c => set.add(c));
    });
    String(x.nombre || "").match(/\d{5,7}/g)?.forEach(c => set.add(c));
    return [...set];
  }
  function coreInst(nombre) { return coreDe(sinCodigo(nombre)); }
  // Dos registros son la misma institución si comparten código, o si (sin códigos) tienen el mismo nombre.
  function mismaInstitucion(a, b) {
    if (a.distrito !== b.distrito) return false;
    const ca = codigosDe(a), cb = codigosDe(b);
    if (ca.length && cb.length) return ca.some(c => cb.includes(c));
    const na = coreInst(a.nombre), nb = coreInst(b.nombre);
    if (!na || !nb) return false;
    return na === nb || (Math.min(na.length, nb.length) >= 12 && (na.includes(nb) || nb.includes(na)));
  }
  function encontrarExistente(clave, distrito, nombre, codigo) {
    const cand = { distrito, nombre, codigo: codigo || "" };
    return instituciones.find(x => x.claveUGEL === clave) || instituciones.find(x => mismaInstitucion(x, cand));
  }
  function gruposDuplicados() {
    const grupos = [], usados = new Set();
    instituciones.forEach(x => {
      if (usados.has(x.id)) return;
      const grupo = [x]; usados.add(x.id);
      instituciones.forEach(y => { if (!usados.has(y.id) && mismaInstitucion(x, y)) { grupo.push(y); usados.add(y.id); } });
      if (grupo.length > 1) grupos.push(grupo);
    });
    return grupos;
  }
  // Exporta todo: instituciones (formato de importación), clasificación y personal, matrícula por nivel y personal.
  async function exportarTodo() {
