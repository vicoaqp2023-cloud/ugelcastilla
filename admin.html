    const hojaI = instituciones.map(x => ({
      distrito: x.distrito, nombre: x.nombre, tipo: v(x.tipo), codigo: v(x.codigo), direccion: v(x.direccion),
      zona: v(x.zona), director: v(x.director), estudiantes: v(x.estudiantes), docentes: v(x.docentes),
      latitud: v(x.latitud), longitud: v(x.longitud), altitud: v(x.altitud),
      imagenes: (x.imagenes || []).join("; "), info: v(x.info)
    }));
    const hojaC = instituciones.map(x => ({
      distrito: x.distrito, nombre: x.nombre, nivel: v(x.nivel), tipo_ie: v(x.tipoIE), gestion: v(x.gestion),
      nro_ie: v(x.nroIE), codigos_modulares: (x.codigosModulares || []).join(" · "), anexo: v(x.anexo),
      zona: v(x.zona), frontera: si(x.frontera), jec: si(x.jec), director: v(x.director), subdirector: v(x.subdirector),
      docentes: v(x.docentes), administrativos: v(x.administrativos), cas: v(x.cas), estudiantes: v(x.estudiantes),
      cargos: (x.personalPublico || []).map(c => `${c.cargo}: ${c.cantidad}`).join(" · "),
      situacion_laboral: res(x, "situacion"), regimen: res(x, "regimen"), jornada: res(x, "jornada"),
      categoria: res(x, "categoria"), tipo_registro: res(x, "tipoRegistro")
    }));
    const hojaM = [];
    instituciones.forEach(x => (x.matriculaPorNivel || []).forEach(m => hojaM.push({
      distrito: x.distrito, nombre: x.nombre, codigo_modular: m.codigo, nivel: m.nivel, tipo_ie: v(m.tipoIE),
      matricula: v(m.matricula), definitiva: v(m.definitiva), en_proceso: v(m.enProceso), grados: v(m.grados)
    })));
    const hojaP = (personalCache || []).map(p => ({
      distrito: v(p.distritoOriginal || p.distrito), institucion: v(p.institucion), apellido_paterno: v(p.apellidoPaterno),
      apellido_materno: v(p.apellidoMaterno), nombres: v(p.nombres), tipo_trabajador: v(p.tipoTrabajador), cargo: v(p.cargo),
      situacion_laboral: v(p.situacionLaboral), categoria: v(p.categoria), jornada: v(p.jornada), regimen: v(p.regimen),
      tipo_registro: v(p.tipoRegistro), codigo_plaza: v(p.codigoPlaza), codigo_personal: v(p.codigoPersona),
      nivel: v(p.nivelEducativo), tipo_ie: v(p.tipoIE), gestion: v(p.gestion), zona: v(p.zonaOriginal), jec: v(p.jec),
      visible_en_publico: p.publico !== false ? "si" : "no"
    }));
    const wb = XLSX.utils.book_new();
    const hojaE = [];
    instituciones.forEach(x => (x.matriculaPorNivel || []).forEach(m => (m.detalle || []).forEach(d => hojaE.push({
      distrito: x.distrito, nombre: x.nombre, nivel: m.nivel, codigo_modular: m.codigo,
      grado_o_edad: d.grado, hombres: d.hombres, mujeres: d.mujeres, total: d.total
    }))));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaI), "Instituciones");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaC), "Clasificacion");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaM), "Matricula");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaE), "Estudiantes por grado");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaP), "Personal");
    const fecha = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `ugel_castilla_exportado_${fecha}.xlsx`);
    aviso(`Exportado: ${hojaI.length} instituciones, ${hojaM.length} filas de matrícula y ${hojaP.length} de personal.`, true);
  }

  // Asigna el anexo cuando su nombre aparece en el nombre o la dirección de la institución.
  async function sugerirAnexos() {
    const cambios = [];
    instituciones.forEach(x => {
      if (x.anexo) return;
      const d = distritos.find(dd => dd.clave === x.distrito);
      if (!d || !d.anexos.length) return;
      const texto = " " + quitaTildes(`${x.nombre} ${x.direccion || ""}`) + " ";
      const hit = d.anexos.find(a => { const qa = quitaTildes(a); return qa.length >= 4 && texto.includes(" " + qa + " "); });
      if (hit) cambios.push({ x, anexo: hit });
    });
    if (!cambios.length) { aviso("No hay coincidencias de anexos por nombre o dirección.", true); return; }
    const lista = cambios.slice(0, 10).map(c => `• ${c.x.nombre} → ${c.anexo}`).join("\n");
    if (!confirm(`Se asignarán ${cambios.length} anexo(s):\n\n${lista}${cambios.length > 10 ? "\n…" : ""}\n\n¿Continuar? Puedes deshacerlo desde Historial.`)) return;
    const respaldo = { items: cambios.map(c => respaldoDe(c.x.id)).filter(Boolean) };
    for (let i = 0; i < cambios.length; i += 450) {
      const batch = db.batch();
      cambios.slice(i, i + 450).forEach(c => batch.update(db.collection("instituciones").doc(c.x.id), { anexo: c.anexo }));
      await batch.commit();
    }
    await registrarHistorial("Institución", "Anexos asignados por nombre", `${cambios.length} instituciones`, respaldo);
    aviso(`Se asignaron ${cambios.length} anexo(s).`, true);
    await cargarTodo();
  }

  async function limpiarDuplicados() {
    const grupos = gruposDuplicados();
    if (!grupos.length) { aviso("No se encontraron instituciones duplicadas.", true); return; }
    const puntaje = x => Object.values(x).filter(v => v !== "" && v !== null && v !== undefined && !(Array.isArray(v) && !v.length)).length;
    const eliminar = [];
    grupos.forEach(g => {
      const keep = [...g].sort((p, q) => puntaje(q) - puntaje(p))[0];
      g.filter(x => x.id !== keep.id).forEach(x => eliminar.push(x));
    });
    if (!confirm(`Se encontraron ${grupos.length} grupo(s) de duplicados. Se conservará una ficha por grupo (la que tiene más datos) y se eliminarán ${eliminar.length}. Puedes deshacerlo desde Historial. ¿Continuar?`)) return;
    for (let i = 0; i < eliminar.length; i += 450) {
      const batch = db.batch();
      eliminar.slice(i, i + 450).forEach(x => batch.delete(db.collection("instituciones").doc(x.id)));
      await batch.commit();
    }
    await registrarHistorial("Institución", "Duplicados eliminados",
      `${eliminar.length} instituciones: ${eliminar.slice(0, 8).map(x => x.nombre).join("; ")}${eliminar.length > 8 ? "…" : ""}`,
      { items: eliminar.map(x => respaldoDe(x.id)).filter(Boolean) });
    aviso(`Se eliminaron ${eliminar.length} duplicados.`, true);
    await cargarTodo();
  }

  // Grupo de cada cargo según la propuesta: jerárquico, docente, administrativo o CAS.
  function grupoCargoAdm(cargo) {
    const u = quitaTildes(cargo);
    if (/director|coord.*pedag/.test(u)) return "Jerárquico";
    if (/profesor|auxiliar educacion|auxiliar de educacion/.test(u)) return "Docente";
    if (/secretar|oficinista|auxiliar de biblioteca|auxiliar de laboratorio|trabajador de servicio/.test(u)) return "Administrativo";
    return "CAS";
  }

  // ---------- Matrícula por nivel (archivos de Inicial, Primaria y Secundaria) ----------
  async function analizarMatricula(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    let h = -1, mapaM = {};
    filas.slice(0, 40).forEach((r, i) => {
      const m = mapearCabecera(r, CANON_MAT);
      if (Object.keys(m).length > Object.keys(mapaM).length) { h = i; mapaM = m; }
    });
    if (h < 0 || mapaM.codMod === undefined) throw new Error("No se encontró la fila de encabezados (Cód. Mod., Total de estudiantes…)");
    const col = k => (mapaM[k] !== undefined ? mapaM[k] : -1);
    const cDist = col("distrito"), cCod = col("codMod"), cNom = col("nombreIE"), cNiv = col("nivel"), cTipo = col("tipoIE"),
          cTot = col("total"), cDef = col("definitiva"), cProc = col("enProceso"), cGr = col("grados");
    const cSecc = col("secciones");
    const colsGrado = [];
    let labActual = "";
    const subHdr = filas[h + 1] || [];
    for (let j = (cSecc >= 0 ? cSecc : cGr) + 1; j < filas[h].length; j++) {
      if (String(filas[h][j] ?? "").trim()) labActual = String(filas[h][j]).replace(/\s+/g, " ").trim();
      const sub = quitaTildes(subHdr[j]);
      if (similitudTxt(sub, "hombres") >= 0.75 || similitudTxt(sub, "mujeres") >= 0.75) colsGrado.push({ j, lab: labActual, sexo: similitudTxt(sub, "hombres") >= 0.75 ? "H" : "M" });
    }
    const distritoDeTxt = t => {
      const n = quitaTildes(t);
      const d = distritos.find(x => quitaTildes(x.clave) === n || quitaTildes(x.nombre) === n);
      return d ? d.clave : null;
    };
    const res = { nuevos: [], actualizar: [], sinCambios: 0, errores: [], distritos: [], personal: [], avisos: 0, diagnostico: [] };
    const grupos = new Map(), porNum = new Map();
    let leidas = 0, excluidas = 0, sinCodigo = 0;
    filas.slice(h + 1).forEach(r => {
      const cod = String(r[cCod] ?? "").trim();
      if (!/^\d{7}$/.test(cod)) { if (cod) sinCodigo++; return; }
      leidas++;
      const distrito = distritoDeTxt(r[cDist]);
      if (!distrito) { excluidas++; return; }
      const nombreRaw = arreglarTexto(r[cNom]);
      const num5 = (nombreRaw.match(/\b\d{5}\b/) || [])[0] || "";
      const nombre = nombreRaw.replace(/\b\d{5,7}\b/g, " ").replace(/\s+/g, " ").trim();
      let clave = `${distrito}|${coreDe(nombre) || ("n" + (num5 || cod))}`;
      if (num5 && porNum.has(num5)) clave = porNum.get(num5);
      if (num5) porNum.set(num5, clave);
      if (!grupos.has(clave)) grupos.set(clave, { clave, distrito, nombres: new Map(), nums: new Set(), niveles: [] });
      const g = grupos.get(clave);
      if (nombre) g.nombres.set(nombre, (g.nombres.get(nombre) || 0) + 1);
      if (num5) g.nums.add(num5);
      const nivelTxt = arreglarTexto(r[cNiv]);
      const nivelCorto = nivelTxt.split(" - ").slice(1).join(" - ").trim() || nivelTxt;
      const porGrado = new Map();
      colsGrado.forEach(cg => {
        const d = porGrado.get(cg.lab) || { grado: cg.lab, hombres: 0, mujeres: 0 };
        d[cg.sexo === "H" ? "hombres" : "mujeres"] = Number(r[cg.j]) || 0;
        porGrado.set(cg.lab, d);
      });
      g.niveles.push({
        nivel: nivelCorto, codigo: cod, tipoIE: arreglarTexto(r[cTipo]),
        matricula: Number(r[cTot]) || 0, definitiva: Number(r[cDef]) || 0,
        enProceso: Number(r[cProc]) || 0, grados: Number(r[cGr]) || 0,
        secciones: Number(r[cSecc]) || 0,
        detalle: [...porGrado.values()].map(d => ({ ...d, total: d.hombres + d.mujeres }))
      });
    });

    grupos.forEach(g => {
      const nombre = [...g.nombres.keys()].sort((a, b) => b.length - a.length)[0] || `I.E. N° ${[...g.nums][0] || ""}`.trim();
      const num5 = [...g.nums][0] || "";
      const codigos = [...new Set(g.niveles.map(x => x.codigo))];
      const datos = {
        distrito: g.distrito, nombre,
        codigosModulares: codigos,
        matriculaPorNivel: g.niveles,
        estudiantes: g.niveles.reduce((t, x) => t + x.matricula, 0)
      };
      if (num5) datos.nroIE = num5;
      const ex = instituciones.find(x => x.distrito === g.distrito && codigos.some(c => codigosDe(x).includes(c)))
        || encontrarExistente(g.clave, g.distrito, nombre, num5);
      if (!ex) {
        datos.codigo = codigos[0] || "";
        datos.imagenes = []; datos.info = "";
        res.nuevos.push({ datos, linea: "matrícula", avisos: [] });
        return;
      }
      const nuevo = { ...ex };
      const cambios = [];
      const set = (k, v) => {
        if (v === undefined || v === "" || (Array.isArray(v) && !v.length)) return;
        if (JSON.stringify(ex[k] ?? null) !== JSON.stringify(v)) { nuevo[k] = v; cambios.push(k); }
      };
      set("codigosModulares", [...new Set([...(ex.codigosModulares || []), ...codigos])]);
      // Cada archivo (inicial, primaria o secundaria) actualiza su nivel y conserva los demás.
      const codsNuevos = new Set(codigos);
      const niveles = [...(ex.matriculaPorNivel || []).filter(m => !codsNuevos.has(m.codigo)), ...g.niveles];
      set("matriculaPorNivel", niveles);
      set("estudiantes", niveles.reduce((t, m) => t + (m.matricula || 0), 0));
      set("nroIE", num5);
      if (!ex.codigo) set("codigo", codigos[0]);
      if (!cambios.length) { res.sinCambios++; (res.yaRegistradas = res.yaRegistradas || []).push(ex.nombre); return; }
      res.actualizar.push({ id: ex.id, nombre: ex.nombre, cambios, datos: nuevo, linea: "matrícula", avisos: [] });
    });

    res.diagnostico = [
      `Filas con código modular leídas: ${leidas}`,
      `Excluidas (otra provincia, p. ej. Cayarani): ${excluidas}`,
      `Filas sin código modular válido: ${sinCodigo}`,
      `Instituciones detectadas (agrupando niveles): ${grupos.size}`,
      `Códigos modulares que se guardarán: ${[...grupos.values()].reduce((t, g) => t + new Set(g.niveles.map(x => x.codigo)).size, 0)}`
    ];
    return res;
  }

  // ---------- Lectura flexible de encabezados (tolera títulos arriba, orden distinto, tildes y errores de escritura) ----------
  const CANON_UGEL = {
    "PROVINCIA": ["provincia"], "DISTRITO": ["distrito"],
    "NIVEL EDUCATIVO": ["nivel educativo", "nivel"],
    "NOMBRE DE LA INSTITUCION EDUCATIVA": ["nombre de la institucion educativa", "nombre de la institucion", "institucion educativa", "nombre ie"],
    "ZONA": ["zona"], "JEC": ["jec", "jornada escolar completa"],
    "TIPO I.E.": ["tipo i.e.", "tipo ie", "tipo de ie"], "GESTION": ["gestion", "gestion ie"],
    "CODIGO DE PLAZA": ["codigo de plaza", "cod plaza", "codigo plaza"],
    "TIPO DE TRABAJADOR": ["tipo de trabajador", "tipo trabajador"], "CARGO": ["cargo"],
    "SITUACION LABORAL": ["situacion laboral", "situacion"],
    "CATEGORIA REMUNERATIVA": ["categoria remunerativa", "escala remunerativa", "categoria", "cat rem", "cat remunerativa", "categ rem", "categ remun", "esc rem", "escala rem"],
    "JORNADA LABORAL": ["jornada laboral", "jor lab", "jornada"], "TIPO DE REGISTRO": ["tipo de registro"],
    "LEY": ["ley", "regimen"], "CODIGO MODULAR": ["codigo modular", "cod modular"],
    "APELLIDO PATERNO": ["apellido paterno", "ap paterno"], "APELLIDO MATERNO": ["apellido materno", "ap materno"],
    "NOMBRES": ["nombres"]
  };
  const CANON_MAT = {
    distrito: ["distrito"], centroPoblado: ["centro poblado"],
    codMod: ["cod mod", "codigo modular", "cod modular", "codigo mod"],
    nombreIE: ["nombre de ie", "nombre ie", "nombre de la institucion", "institucion educativa"],
    nivel: ["nivel"], tipoIE: ["tipo ie", "tipo de ie"],
    total: ["total de estudiantes matriculados", "total de estudiantes", "total estudiantes matriculados"],
    definitiva: ["matricula definitiva", "definitiva"], enProceso: ["matricula en proceso", "en proceso"],
    grados: ["total grados", "total de grados"], secciones: ["total secciones", "total de secciones"]
  };
  function similitudTxt(h, a) {
    if (!h || !a) return 0;
    if (h === a) return 1;
    if (a.length >= 4 && h.includes(a) && a.length >= 0.7 * h.length) return 0.9;
    return 1 - distEd(h, a) / Math.max(h.length, a.length);
  }
  function mapearCabecera(fila, canon) {
    const usados = new Set(), mapa = {};
    Object.entries(canon).forEach(([clave, alias]) => {
      let mejorJ = -1, mejorS = 0;
      fila.forEach((celda, j) => {
        if (usados.has(j)) return;
        const h = quitaTildes(celda);
        if (!h) return;
        alias.forEach(al => { const s2 = similitudTxt(h, quitaTildes(al)); if (s2 > mejorS) { mejorS = s2; mejorJ = j; } });
      });
      if (mejorS >= 0.8 && mejorJ >= 0) { mapa[clave] = mejorJ; usados.add(mejorJ); }
    });
    return mapa;
  }
  // Busca el encabezado en las primeras 40 filas y devuelve las filas de datos con claves canónicas.
  function leerHojaFlexible(ws, canon) {
    const filas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: false });
    let mejor = { fila: -1, score: 0, mapa: {} };
    filas.slice(0, 40).forEach((r, i) => {
      const m = mapearCabecera(r, canon), n = Object.keys(m).length;
      if (n > mejor.score) mejor = { fila: i, score: n, mapa: m };
    });
    if (mejor.score < 2) return [];
    return filas.slice(mejor.fila + 1).map(r => {
      const o = {};
      Object.entries(mejor.mapa).forEach(([k, j]) => { o[k] = r[j] ?? ""; });
      return o;
    });
  }
  // Devuelve las filas con el encabezado detectado en cualquier fila (para usar la normalización por nombre).
  function hojaConEncabezado(ws) {
    const filas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: false });
    let mejor = { fila: 0, score: -1 };
    filas.slice(0, 40).forEach((r, i) => {
      const n = Object.keys(mapearCabecera(r, CANON_UGEL)).length;
      if (n > mejor.score) mejor = { fila: i, score: n };
    });
    const cab = filas[mejor.fila] || [];
    return filas.slice(mejor.fila + 1).map(r => {
      const o = {};
      cab.forEach((h, j) => { if (String(h).trim()) o[String(h).trim()] = r[j] ?? ""; });
      return o;
    });
  }

  // Convierte el texto "cargo; cantidad" (una línea por cargo) en la lista de personal visible.
  function parsePersonal(texto) {
    return String(texto || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const [cargo, cant] = l.split(";").map(x => (x || "").trim());
      const cantidad = Number(cant);
      return cargo && !Number.isNaN(cantidad) ? { cargo, cantidad } : null;
    }).filter(Boolean);
  }

  async function analizarAuto(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filasRaw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    const esMatricula = filasRaw.slice(0, 40).some(r => { const m = mapearCabecera(r, CANON_MAT); return m.codMod !== undefined && m.total !== undefined; });
    if (esMatricula) return analizarMatricula(file);
    const esUGEL = filasRaw.slice(0, 40).some(r => { const m = mapearCabecera(r, CANON_UGEL); return m["NOMBRE DE LA INSTITUCION EDUCATIVA"] !== undefined && m["TIPO DE TRABAJADOR"] !== undefined; });
    return esUGEL ? analizarUGEL(file) : analizarArchivo(file);
  }
  // Muestra cuántas copias hay (sin borrar nada) y cuántas personas tienen varias plazas.
  async function verificarRepetidosPersonal() {
    await cargarPersonal();
    const lista = personalCache || [];
    const porPlaza = new Map(), porNombre = new Map();
    lista.forEach(p => {
      const nombre = quitaTildes(p.nombreCompleto);
      if (p.codigoPlaza) {
        const k = quitaTildes(p.codigoPlaza) + "|" + nombre;
        if (!porPlaza.has(k)) porPlaza.set(k, []);
        porPlaza.get(k).push(p);
      }
      if (nombre) {
        if (!porNombre.has(nombre)) porNombre.set(nombre, []);
        porNombre.get(nombre).push(p);
      }
    });
    const exactos = [...porPlaza.values()].filter(l => l.length > 1);
    const copias = exactos.reduce((t, l) => t + l.length - 1, 0);
    const conVariasPlazas = [...porNombre.values()].filter(l => new Set(l.map(p => quitaTildes(p.codigoPlaza))).size > 1).length;
    const cont = $("verificacionPers");
    if (!cont) return;
    cont.innerHTML = `<div class="panel" style="margin:0">
      <h3>Resultado de la verificación</h3>
      <p class="nota">Registros totales: ${lista.length} · Personas distintas: ${porNombre.size}</p>
      <p>Copias exactas (misma persona y misma plaza): <b>${copias}</b>, en ${exactos.length} caso(s).</p>
      <p>Personas con varias plazas (correcto, no se eliminan): <b>${conVariasPlazas}</b>.</p>
      <p>Registros sin categoría: <b>${lista.filter(p => !String(p.categoria || "").trim()).length}</b>. Si hay, vuelve a importar el Excel de la UGEL para completarlas.</p>
      ${exactos.length ? `<div class="tabla" style="max-height:320px;overflow:auto"><table><thead><tr><th>Código de plaza</th><th>Apellidos y nombres</th><th>Copias</th></tr></thead>
        <tbody>${exactos.slice(0, 200).map(l => `<tr><td>${esc(l[0].codigoPlaza)}</td><td>${esc(l[0].nombreCompleto)}</td><td>${l.length}</td></tr>`).join("")}</tbody></table></div>` : `<p class="ok">No hay copias exactas.</p>`}
      </div>`;
  }

  // Elimina un solo registro de personal.
  async function eliminarPersonal(id) {
    const p = (personalCache || []).find(x => x.id === id);
    if (!p) return;
    if (!confirm(`¿Eliminar a ${p.nombreCompleto} (plaza ${p.codigoPlaza || "sin código"})?`)) return;
    await db.collection("personal").doc(id).delete();
    aviso("Registro eliminado.", true);
    await cargarPersonal();
  }

  // Elimina las copias de la misma persona con la misma plaza. Conserva la fila con más datos.
  async function limpiarPersonalRepetido() {
    await cargarPersonal();
    const grupos = new Map();
    (personalCache || []).forEach(p => {
      if (!p.codigoPlaza) return;
      const k = quitaTildes(p.codigoPlaza) + "|" + quitaTildes(p.nombreCompleto);
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(p);
    });
    const puntaje = p => Object.values(p).filter(v => v !== "" && v !== null && v !== undefined).length;
    const borrar = [], completar = [];
    grupos.forEach(lista => {
      if (lista.length < 2) return;
      const keep = [...lista].sort((a, b) => puntaje(b) - puntaje(a))[0];
      // Antes de borrar, la copia que se conserva recibe los datos que le faltan (por ejemplo, la categoría).
      const relleno = {};
      lista.forEach(p => Object.entries(p).forEach(([k, v]) => {
        if (k === "id") return;
        const vacio = v === "" || v === null || v === undefined;
        if (vacio || (keep[k] === "" || keep[k] === null || keep[k] === undefined)) {
          if (!vacio && (keep[k] === "" || keep[k] === null || keep[k] === undefined) && relleno[k] === undefined) relleno[k] = v;
        }
      }));
      if (Object.keys(relleno).length) completar.push({ id: keep.id, datos: relleno });
      lista.filter(p => p.id !== keep.id).forEach(p => borrar.push(p));
    });
    for (const c of completar) await db.collection("personal").doc(c.id).update(c.datos);
    if (!borrar.length) { aviso("No hay registros repetidos.", true); return; }
    if (!confirm(`Se eliminarán ${borrar.length} registro(s) repetidos (misma persona y misma plaza). Quedará uno por cada caso. Esta acción no se puede deshacer. ¿Continuar?`)) return;
    for (let i = 0; i < borrar.length; i += 450) {
      const batch = db.batch();
      borrar.slice(i, i + 450).forEach(p => batch.delete(db.collection("personal").doc(p.id)));
      await batch.commit();
    }
    await registrarHistorial("Personal", "Repetidos eliminados", `${borrar.length} registros`);
    aviso(`Se eliminaron ${borrar.length} registro(s) repetidos.`, true);
    await cargarPersonal();
  }

  async function cargarPersonal() {
    try {
      const snap = await db.collection("personal").get();
      personalCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      personalCache = [];
      aviso("No se pudo cargar el personal: " + e.message);
    }
    if (tab === "personal") pintarAdmin();
  }

  // ---------- Archivo de personal de la UGEL: reconocer las columnas aunque cambien de escritura ----------
  // Nombre que usa el sistema → cómo puede venir escrito en el Excel (sin tildes, en minúsculas, sin puntos).
  const COLUMNAS_UGEL = {
    "PROVINCIA": [/^provincia$/],
    "DISTRITO": [/^distrito$/],
    "CODIGO MODULAR": [/^codigo modular$/, /^cod mod/],
    "APELLIDO PATERNO": [/paterno/],
    "APELLIDO MATERNO": [/materno/],
    "NOMBRES": [/^nombres?$/],
    "TIPO DE TRABAJADOR": [/trabajador/],
    "CARGO": [/^cargo$/, /^cargo /],
    "SITUACION LABORAL": [/situacion/],
    "CATEGORIA REMUNERATIVA": [/categ/, /^cat/, /remun/, /escala/, /^esc\b/],
    "JORNADA LABORAL": [/jornada/],
    "LEY": [/^ley$/, /regimen/],
    "TIPO DE REGISTRO": [/registro/],
    "CODIGO DE PLAZA": [/plaza/],
    "NIVEL EDUCATIVO": [/nivel educativo/, /^nivel$/],
    "TIPO I.E.": [/^tipo i e/, /^tipo ie/, /^tipo de i e/, /^tipo de institucion/],
    "GESTION": [/gestion/],
    "ZONA": [/^zona$/],
    "JEC": [/^jec$/],
    "NOMBRE DE LA INSTITUCION EDUCATIVA": [/nombre de la institucion/, /institucion educativa/, /^nombre de la i e/]
  };

  function normalizarColumnasUGEL(filasCrudas) {
    const cab = filasCrudas.length ? Object.keys(filasCrudas[0]) : [];
    const usados = new Set(), mapa = {};
    const reclamar = (canon, prueba) => {
      const h = cab.find(c => !usados.has(c) && prueba(quitaTildes(c)));
      if (h === undefined) return false;
      usados.add(h); mapa[canon] = h; return true;
    };
    Object.keys(COLUMNAS_UGEL).forEach(c => reclamar(c, n => n === quitaTildes(c)));        // 1) mismo nombre (ignorando tildes, mayúsculas, espacios y puntos)
    Object.entries(COLUMNAS_UGEL).forEach(([c, pats]) => {                                   // 2) nombre parecido
      if (!mapa[c]) pats.some(pat => reclamar(c, n => pat.test(n)));
    });
    const filas = filasCrudas.map(f => {
      const o = {};
      Object.keys(COLUMNAS_UGEL).forEach(c => { o[c] = mapa[c] !== undefined ? f[mapa[c]] : ""; });
      return o;
    });
    return {
      filas, mapa,
      faltantes: Object.keys(COLUMNAS_UGEL).filter(c => !mapa[c]),
      renombradas: Object.entries(mapa).filter(([c, h]) => quitaTildes(c) !== quitaTildes(h) || c !== String(h).trim()).map(([c, h]) => `${c} ← «${String(h).trim()}»`)
    };
  }

  async function analizarUGEL(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const colUGEL = normalizarColumnasUGEL(hojaConEncabezado(wb.Sheets[wb.SheetNames[0]]));
    // Quita las filas repetidas: misma persona con la misma plaza. Se conserva la fila con más datos.
    const dedup = { repetidas: 0, personas: 0 };
    const filas = (() => {
      const unicos = [], vistos = new Map(), personasSet = new Set();
      const puntaje = f => Object.values(f).filter(v => String(v).trim() !== "").length;
      colUGEL.filas.forEach(f => {
        const persona = quitaTildes(`${f["APELLIDO PATERNO"]} ${f["APELLIDO MATERNO"]} ${f["NOMBRES"]}`);
        if (persona) personasSet.add(persona);
        const plaza = quitaTildes(f["CODIGO DE PLAZA"]);
        if (!plaza || !persona) { unicos.push(f); return; }
        const clave = plaza + "|" + persona;
        if (!vistos.has(clave)) { vistos.set(clave, unicos.length); unicos.push(f); return; }
        dedup.repetidas++;
        const i = vistos.get(clave);
        if (puntaje(f) > puntaje(unicos[i])) unicos[i] = f;
      });
      dedup.personas = personasSet.size;
      return unicos;
    })();
    const res = { nuevos: [], actualizar: [], sinCambios: 0, errores: [], distritos: [], personal: [], avisos: 0, diagnostico: [] };
    if (colUGEL.faltantes.includes("CATEGORIA REMUNERATIVA")) {
      const encabezados = Object.keys(colUGEL.filas[0] || {}).join(" | ") || "(ninguno)";
      res.errores.push(`No se encontró la columna de categoría remunerativa. Encabezados leídos: ${encabezados}. Revisa que exista una columna llamada CATEGORIA REMUNERATIVA o ESCALA REMUNERATIVA.`);
    }
    const grupos = new Map();
    const sede = [], sinClasif = [];
    let fuera = 0, leidos = 0, conCodigo = 0, c7 = 0, c5 = 0, enInstituciones = 0;
    const distritoDe = t => {
      const n = quitaTildes(t);
      const d = distritos.find(x => quitaTildes(x.clave) === n || quitaTildes(x.nombre) === n);
      return d ? d.clave : null;
    };
    // Todas las columnas del archivo (excepto provincia) se guardan en cada registro de personal.
    const persona = (f, nivelTxt, zn, clave, distrito, institucion) => ({
      claveUGEL: clave, distrito, institucion,
      distritoOriginal: arreglarTexto(f["DISTRITO"]),
      codigoPersona: arreglarTexto(f["CODIGO MODULAR"]),
      apellidoPaterno: arreglarTexto(f["APELLIDO PATERNO"]),
      apellidoMaterno: arreglarTexto(f["APELLIDO MATERNO"]),
      nombres: arreglarTexto(f["NOMBRES"]),
      nombreCompleto: arreglarTexto(`${f["APELLIDO PATERNO"]} ${f["APELLIDO MATERNO"]}, ${f["NOMBRES"]}`),
      tipoTrabajador: arreglarTexto(f["TIPO DE TRABAJADOR"]),
      cargo: arreglarTexto(f["CARGO"]),
      situacionLaboral: arreglarTexto(f["SITUACION LABORAL"]),
      categoria: arreglarTexto(f["CATEGORIA REMUNERATIVA"]).replace(/\.0+$/, ""),
      jornada: arreglarTexto(f["JORNADA LABORAL"]),
      regimen: arreglarTexto(f["LEY"]),
      tipoRegistro: arreglarTexto(f["TIPO DE REGISTRO"]),
      codigoPlaza: arreglarTexto(f["CODIGO DE PLAZA"]),
      nivelEducativo: nivelTxt,
      tipoIE: arreglarTexto(f["TIPO I.E."]),
      gestion: arreglarTexto(f["GESTION"]),
      zonaOriginal: arreglarTexto(f["ZONA"]),
      zona: zn,
      jec: arreglarTexto(f["JEC"]),
      institucionOriginal: arreglarTexto(f["NOMBRE DE LA INSTITUCION EDUCATIVA"])
    });

    filas.forEach((f, i) => {
      if (!Object.values(f).some(v => String(v).trim() !== "")) return;
      leidos++;
      const linea = i + 2;
      const prov = quitaTildes(f["PROVINCIA"]);
      if (prov && prov !== "castilla") { fuera++; return; }
      const nivelTxt = arreglarTexto(f["NIVEL EDUCATIVO"]);
      if (quitaTildes(nivelTxt).startsWith("administracion")) {
        sede.push(persona(f, nivelTxt, "", "SEDE-UGEL", "", "Sede de la UGEL"));
        return;
      }
      const distrito = distritoDe(f["DISTRITO"]);
      const { nombre, codigo } = extraerCodigoNombre(f["NOMBRE DE LA INSTITUCION EDUCATIVA"]);
      if (!distrito || !(nombre || codigo)) {
        res.errores.push(`Fila ${linea}: ${!distrito ? `distrito "${arreglarTexto(f["DISTRITO"])}" no reconocido` : "sin nombre de institución"}; el personal se guarda sin institución`);
        sinClasif.push(persona(f, nivelTxt, "", "SIN-CLASIFICAR", "", arreglarTexto(f["NOMBRE DE LA INSTITUCION EDUCATIVA"]) || "(sin institución)"));
        return;
      }
      const nombreFinal = nombre || `I.E. N° ${codigo}`;
      const core = coreDe(nombre) || ("cod" + codigo);
      const clave = codigo ? `${distrito}|cod${codigo}` : `${distrito}|${core}`;
      if (!grupos.has(clave)) grupos.set(clave, { clave, distrito, core, nombres: new Map(), codigo: "", niveles: new Set(),
        zonas: new Map(), gestion: new Map(), tipoIE: new Map(), filasGrupo: 0, fron: 0, jecSi: 0, cargos: new Map(),
        situacion: new Map(), regimen: new Map(), jornada: new Map(), categoria: new Map(), tipoRegistro: new Map(), cargoDet: new Map(),
        docentes: 0, administrativos: 0, cas: 0, director: "", subdirector: "", personal: [], filas: linea });
      const g = grupos.get(clave);
      g.filasGrupo++;
      g.nombres.set(nombreFinal, (g.nombres.get(nombreFinal) || 0) + 1);
      if (codigo && (!g.codigo || codigo.length === 7)) g.codigo = codigo;
      const niv = nivelNormal(nivelTxt); if (niv) g.niveles.add(niv);
      const zn = zonaNormal(f["ZONA"]); if (zn) g.zonas.set(zn, (g.zonas.get(zn) || 0) + 1);
      const tz = quitaTildes(f["ZONA"]);
      if (tz.includes("frontera") && !tz.includes("no frontera")) g.fron++;
      if (/^(si|s|1|x|yes|true)$/.test(quitaTildes(f["JEC"]))) g.jecSi++;
      const cuenta = (mapa, v) => { const t = arreglarTexto(v); if (t) mapa.set(t, (mapa.get(t) || 0) + 1); };
      cuenta(g.gestion, f["GESTION"]); cuenta(g.tipoIE, f["TIPO I.E."]);
      cuenta(g.situacion, f["SITUACION LABORAL"]); cuenta(g.regimen, f["LEY"]);
      cuenta(g.jornada, f["JORNADA LABORAL"]); cuenta(g.categoria, f["CATEGORIA REMUNERATIVA"]);
      cuenta(g.tipoRegistro, f["TIPO DE REGISTRO"]);
      const cargo = arreglarTexto(f["CARGO"]); if (cargo) g.cargos.set(cargo, (g.cargos.get(cargo) || 0) + 1);
      if (cargo) {
        const d = g.cargoDet.get(cargo) || { tipo: new Map(), situacion: new Map() };
        cuenta(d.tipo, f["TIPO DE TRABAJADOR"]); cuenta(d.situacion, f["SITUACION LABORAL"]);
        g.cargoDet.set(cargo, d);
      }
      const cq = quitaTildes(cargo);
      const nombrePersona = () => arreglarTexto(`${f["NOMBRES"]} ${f["APELLIDO PATERNO"]} ${f["APELLIDO MATERNO"]}`).toLowerCase().replace(/(^|\s)(\S)/g, (m, x, y) => x + y.toUpperCase());
      if (!g.director && (cq === "director i e" || cq === "director ie")) g.director = nombrePersona();
      if (!g.subdirector && (cq === "sub director i e" || cq === "subdirector i e")) g.subdirector = nombrePersona();
      const tt = quitaTildes(f["TIPO DE TRABAJADOR"]);
      if (/docen/.test(tt)) g.docentes++;
      else if (/administr/.test(tt)) g.administrativos++;
      else if (/^cas\b|\bcas\b/.test(tt)) g.cas++;
      enInstituciones++;
      g.personal.push(persona(f, nivelTxt, zn, clave, distrito, nombreFinal));
    });

    const masComun = m => [...m.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || "";
    const resumenTxt = m => [...m.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k}: ${v}`).join("; ");
    grupos.forEach(g => {
      const nombre = [...g.nombres.keys()].sort((a, b) => b.length - a.length)[0];
      if (g.codigo) { conCodigo++; g.codigo.length === 7 ? c7++ : c5++; }
      const clasif = {
        nivel: NIVEL_ORDEN.filter(x => g.niveles.has(x)).join(" / "),
        tipoIE: masComun(g.tipoIE),
        gestion: masComun(g.gestion),
        zona: masComun(g.zonas),
        frontera: g.fron > g.filasGrupo / 2,
        jec: g.jecSi > g.filasGrupo / 2,
        nroIE: g.codigo.length === 5 ? g.codigo : "",
        docentes: g.docentes, administrativos: g.administrativos, cas: g.cas,
        personalPublico: [...g.cargos.entries()].map(([cargo, cantidad]) => {
          const d = g.cargoDet.get(cargo);
          return { cargo, cantidad, grupo: grupoCargoAdm(cargo), tipo: d ? masComun(d.tipo) : "", situacion: d ? resumenTxt(d.situacion) : "" };
        }).sort((a, b) => b.cantidad - a.cantidad),
        resumenPersonal: {
          situacion: resumenTxt(g.situacion), regimen: resumenTxt(g.regimen), jornada: resumenTxt(g.jornada),
          categoria: resumenTxt(g.categoria), tipoRegistro: resumenTxt(g.tipoRegistro)
        }
      };
      if (g.director) clasif.director = g.director;
      clasif.plazasPublicas = g.personal.map(x => ({
        codigoPlaza: x.codigoPlaza, cargo: x.cargo, situacion: x.situacionLaboral, categoria: x.categoria,
        jornada: x.jornada, regimen: x.regimen, tipoRegistro: x.tipoRegistro, tipoTrabajador: x.tipoTrabajador
      })).sort((a, b) => String(a.cargo).localeCompare(String(b.cargo), "es"));
      const codigo7 = g.codigo.length === 7 ? g.codigo : "";
      const ex = encontrarExistente(g.clave, g.distrito, nombre, g.codigo);
      if (g.subdirector) clasif.subdirector = g.subdirector;
      else clasif.subdirector = (ex && ex.subdirector && ex.subdirector !== "No hay") ? ex.subdirector : "No hay";
      const avisos = [];
      if (g.nombres.size > 1) avisos.push(`nombre unificado (${g.nombres.size} variantes en el archivo)`);
      res.personal.push({ clave: g.clave, docs: g.personal });
      if (!ex) {
        const datos = { distrito: g.distrito, nombre, codigo: codigo7, claveUGEL: g.clave, imagenes: [], info: "", ...clasif };
        if (avisos.length) res.avisos++;
        res.nuevos.push({ datos, linea: g.filas, avisos });
        return;
      }
      const nuevo = { ...ex };
      const cambios = [];
      const campos = { claveUGEL: g.clave, codigo: codigo7, ...clasif };
      Object.entries(campos).forEach(([k, v]) => {
        if (v === undefined || v === "") return;
        if (JSON.stringify(ex[k] ?? null) !== JSON.stringify(v)) { nuevo[k] = v; cambios.push(k); }
      });
      if (!cambios.length) { res.sinCambios++; (res.yaRegistradas = res.yaRegistradas || []).push(ex.nombre); return; }
      if (avisos.length) res.avisos++;
      res.actualizar.push({ id: ex.id, nombre: ex.nombre, cambios, datos: nuevo, linea: g.filas, avisos });
    });

    if (sede.length) res.personal.push({ clave: "SEDE-UGEL", docs: sede });
    if (sinClasif.length) res.personal.push({ clave: "SIN-CLASIFICAR", docs: sinClasif });
    const totalPersonal = sede.length + sinClasif.length + enInstituciones;
    res.diagnostico = [
      `Filas con datos leídas: ${leidos}`,
      `Registros repetidos (misma persona y misma plaza) omitidos: ${dedup.repetidas}`,
      `Personas distintas en el archivo: ${dedup.personas}`,
      `Excluidas por ser de otra provincia: ${fuera}`,
      `Sede de la UGEL: ${sede.length} registros de personal (no se crea como institución)`,
      `Instituciones detectadas: ${grupos.size}`,
      `Instituciones con código dentro del nombre: ${conCodigo} (7 dígitos: ${c7}, 5 dígitos: ${c5})`,
      `Registros de personal que se guardarán: ${totalPersonal} de ${leidos - fuera} (instituciones ${enInstituciones}, sede UGEL ${sede.length}, sin clasificar ${sinClasif.length})`,
      `Filas con advertencia: ${res.errores.length}`
    ];
    // Control de lectura: qué columnas se reconocieron y cuántas personas quedaron con categoría
    const docsP = res.personal.flatMap(g => g.docs);
    const conCat = docsP.filter(d => d.categoria).length;
    res.diagnostico.push(`${conCat < docsP.length ? "⚠️ " : ""}Personas con categoría remunerativa: ${conCat} de ${docsP.length}`);
    if (colUGEL.renombradas.length) res.diagnostico.push(`Columnas leídas con otra escritura: ${colUGEL.renombradas.join("; ")}`);
    if (colUGEL.faltantes.length) res.diagnostico.push(`⚠️ Columnas que no se encontraron en el archivo: ${colUGEL.faltantes.join(", ")}`);
    return res;
  }

  function pintarLogoTop() {
    const img = document.getElementById("logoTop");
    if (img) img.src = (portadaCfg && portadaCfg.logo) || LOGO_ADM_DEFAULT;
  }
  const PORTADA_DEFAULT = {
    logo: "", fondo: "", fondoOpacidad: 70, altura: 520,
    colorPrincipal: "#0f321e", colorAcento: "#c8a34b",
    eyebrow: "Municipalidad Provincial de Castilla · Aplao",
    titulo: "Directorio de instituciones educativas",
    subtitulo: "Consulta las instituciones de la provincia de Castilla: ubicación, datos, personal y anexos.",
    boton1Texto: "Ver mapa de instituciones", boton1Accion: "mapa", boton1Url: "",
    boton2Texto: "Explorar distritos", boton2Accion: "distritos", boton2Url: "",
    mostrarBotones: true
  };
  let portadaCfg = null;
  async function cargarPortadaAdm() {
    try {
      const doc = await db.collection("config").doc("portada").get();
      portadaCfg = { ...PORTADA_DEFAULT, ...(doc.exists ? doc.data() : {}) };
    } catch (e) {
      portadaCfg = { ...PORTADA_DEFAULT };
      aviso("No se pudo leer la portada: " + e.message);
    }
    pintarLogoTop();
    if (tab === "portada") pintarAdmin();
  }
  const opcionesAccion = sel => [["mapa", "Abrir el mapa"], ["distritos", "Ir a los distritos"], ["url", "Abrir un enlace"]]
    .map(([v, t]) => `<option value="${v}" ${sel === v ? "selected" : ""}>${t}</option>`).join("");
  function vPortada() {
    if (portadaCfg === null) return `<h1 class="titulo">Portada</h1><p class="vacio">Cargando…</p>`;
    const c = portadaCfg;
    return `
      <h1 class="titulo">Portada de la página principal</h1>
      <p class="sub">Cambia el logo, el fondo, los textos y los botones. Al guardar, la portada se actualiza en la página principal al pulsar “Actualizar datos”.</p>
      <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <form data-form="portada" class="panel" style="margin:0">
        <h3>Logo</h3>
        <div class="grid">
          <label>Logo (enlace de la imagen)<input name="logo" value="${esc(c.logo)}" placeholder="Vacío = logo de la UGEL"></label>
          <label>Subir logo desde tu computadora<input type="file" id="portadaLogoArchivo" accept="image/*"></label>
        </div>
        <h3>Fondo</h3>
        <div class="grid">
          <label>Imagen de fondo (enlace)<input name="fondo" value="${esc(c.fondo)}" placeholder="Vacío = color sólido"></label>
          <label>Subir fondo desde tu computadora<input type="file" id="portadaFondoArchivo" accept="image/*"></label>
          <label>Oscurecimiento del fondo (0 a 100)<input name="fondoOpacidad" type="number" min="0" max="100" value="${esc(c.fondoOpacidad)}"></label>
          <label>Altura de la portada (px)<input name="altura" type="number" min="300" max="900" value="${esc(c.altura)}"></label>
          <label>Color principal<input name="colorPrincipal" type="color" value="${esc(c.colorPrincipal)}"></label>
          <label>Color de acento (botón principal)<input name="colorAcento" type="color" value="${esc(c.colorAcento)}"></label>
        </div>
        <h3>Textos</h3>
        <label>Etiqueta superior<input name="eyebrow" value="${esc(c.eyebrow)}"></label>
        <label style="margin-top:10px">Título<input name="titulo" value="${esc(c.titulo)}"></label>
        <label style="margin-top:10px">Subtítulo<textarea name="subtitulo">${esc(c.subtitulo)}</textarea></label>
        <h3>Botones</h3>
        <label class="check"><input type="checkbox" name="mostrarBotones" ${c.mostrarBotones ? "checked" : ""} style="width:auto"> Mostrar botones</label>
        <div class="grid" style="margin-top:8px">
          <label>Botón 1 - texto<input name="boton1Texto" value="${esc(c.boton1Texto)}"></label>
          <label>Botón 1 - acción<select name="boton1Accion">${opcionesAccion(c.boton1Accion)}</select></label>
          <label>Botón 1 - enlace (solo si la acción es “Abrir un enlace”)<input name="boton1Url" value="${esc(c.boton1Url)}"></label>

      ids.slice(i, i + 450).forEach(id => batch.update(db.collection("personal").doc(id), { publico: valor }));

  async function escribirPersonal(grupos) {
    const todos = await db.collection("personal").get();
    const flags = new Map();
    const ops = [];
    todos.forEach(doc => {
      const v = doc.data();
      flags.set(`${v.codigoPersona}|${v.codigoPlaza}|${v.cargo}`, v.publico);
      ops.push({ borrar: true, ref: doc.ref });
    });
    grupos.forEach(g => g.docs.forEach(d => {
      const clave = `${d.codigoPersona}|${d.codigoPlaza}|${d.cargo}`;
      const pub = flags.has(clave) ? flags.get(clave) : true;
      ops.push({ borrar: false, ref: db.collection("personal").doc(), datos: { ...d, publico: pub !== false } });
    }));
    for (let i = 0; i < ops.length; i += 450) {
      const batch = db.batch();
      ops.slice(i, i + 450).forEach(o => o.borrar ? batch.delete(o.ref) : batch.set(o.ref, o.datos));
      await batch.commit();
    }
  }

  async function aplicarImportacionInterna() {
    if (!plan) return;
    const resumen = `${plan.nuevos.length} nuevas, ${plan.actualizar.length} actualizadas, ${plan.distritos.length} distritos`;
    if (instituciones.length && !plan.respaldoHecho) {
      plan.respaldoHecho = true;
      const fecha = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
      const url = URL.createObjectURL(new Blob([JSON.stringify(instituciones, null, 2)], { type: "application/json" }));
      const enlace = document.createElement("a");
      enlace.href = url; enlace.download = `respaldo_instituciones_${fecha}.json`; enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    for (const a of plan.actualizar) {
      const ex = instituciones.find(x => x.id === a.id);
      if (ex && ex.coordsVerificadas && hayCambioCoords(ex, a.datos)) {
        const aceptar = await pedirConfirmacionCoords(ex.nombre, ex, a.datos);
        if (!aceptar) { a.datos.latitud = ex.latitud ?? null; a.datos.longitud = ex.longitud ?? null; }
      }
    }
    const ops = [];
    plan.nuevos.forEach(n => ops.push({ ref: db.collection("instituciones").doc(), datos: n.datos, merge: false }));
    plan.actualizar.forEach(a => {
      const { id, ...sinId } = a.datos;
      ops.push({ ref: db.collection("instituciones").doc(a.id), datos: sinId, merge: false });
    });
    plan.distritos.forEach(d => {
      const { clave, ...resto } = d;
      ops.push({ ref: db.collection("distritos").doc(clave), datos: { clave, ...resto }, merge: true });
    });
    if (plan.personal && plan.personal.length) await escribirPersonal(plan.personal);
    for (let i = 0; i < ops.length; i += 450) {
      const batch = db.batch();
      ops.slice(i, i + 450).forEach(o => batch.set(o.ref, o.datos, o.merge ? { merge:true } : {}));
      await batch.commit();
    }
    registrarHistorial("Importación Excel", "Aplicada", resumen);
    plan = null;
    aviso(`Importación aplicada: ${ops.length} cambios guardados.`, true);
    await cargarTodo();
  }

  function hayCambioCoords(antes, despues) {
    if (antes.latitud == null || antes.longitud == null) return false;
    return (antes.latitud ?? null) !== (despues.latitud ?? null) || (antes.longitud ?? null) !== (despues.longitud ?? null);
  }

  function pedirConfirmacionCoords(nombre, antes, despues) {
    const fmt = (la, lo) => (la == null || lo == null) ? "sin coordenadas" : `${Number(la).toFixed(6)}, ${Number(lo).toFixed(6)}`;
    const btn = "border:none;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;";
    return new Promise(resolve => {
      const velo = document.createElement("div");
      velo.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px";
      velo.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:460px;width:100%;padding:22px;color:#172b4d;box-shadow:0 20px 50px rgba(0,0,0,.25)">
          <h3 style="margin:0 0 10px;color:#123b66">Confirmar cambio de coordenadas</h3>
          <p style="margin:0 0 10px"><b>${esc(nombre)}</b></p>
          <p style="margin:0 0 6px">¿Desea modificar estas coordenadas</p>
          <p style="margin:0 0 6px;font-family:monospace;background:#f1f5f9;padding:6px 8px;border-radius:6px">${fmt(antes.latitud, antes.longitud)}</p>
          <p style="margin:0 0 6px">por estas?</p>
          <p style="margin:0 0 18px;font-family:monospace;background:#ecfdf5;padding:6px 8px;border-radius:6px">${fmt(despues.latitud, despues.longitud)}</p>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button type="button" data-no style="${btn}background:#fde8e1;color:#9a3412">Rechazar</button>
            <button type="button" data-si style="${btn}background:#123b66;color:#fff">Aceptar</button>
          </div></div>`;
      document.body.appendChild(velo);
      const cerrar = ok => { velo.remove(); resolve(ok); };
      velo.querySelector("[data-no]").onclick = () => cerrar(false);
      velo.querySelector("[data-si]").onclick = () => cerrar(true);
    });
  }

  async function guardarInstitucion(f) {
    const fd = new FormData(f);
    const get = k => String(fd.get(k) ?? "").trim();
    const num = k => {
      if (get(k) === "") return null;
      const n = Number(get(k).replace(",", "."));
      if (Number.isNaN(n)) throw new Error(`"${k}" debe ser un número`);
      return n;
    };
    const imagenes = get("imagenes").split(/[\n;,]/).map(s => s.trim()).filter(Boolean);
    const extras = [...f.querySelectorAll(".fila-extra")]
      .map(r => ({ campo: r.querySelector("[data-k]").value.trim(), valor: r.querySelector("[data-v]").value.trim() }))
      .filter(x => x.campo && x.valor);
    const latitud = num("latitud"), longitud = num("longitud");
    if (latitud !== null && (latitud < LIM_CASTILLA.latMin || latitud > LIM_CASTILLA.latMax)) {
      throw new Error(`La latitud (${latitud}) no parece estar dentro de Castilla (debe ser negativa, aprox. entre ${LIM_CASTILLA.latMin} y ${LIM_CASTILLA.latMax}). Revisa el signo o si se cruzó con la longitud.`);
    }
    if (longitud !== null && (longitud < LIM_CASTILLA.lngMin || longitud > LIM_CASTILLA.lngMax)) {
      throw new Error(`La longitud (${longitud}) no parece estar dentro de Castilla (debe ser negativa, aprox. entre ${LIM_CASTILLA.lngMin} y ${LIM_CASTILLA.lngMax}). Revisa el signo o si se cruzó con la latitud.`);
    }
    if (latitud !== null && longitud !== null) {
      const otras = instituciones.filter(x => x.distrito === get("distrito") && x.id !== f.dataset.id &&
        typeof x.latitud === "number" && typeof x.longitud === "number");
      if (otras.length) {
        const mLat = otras.reduce((t, x) => t + x.latitud, 0) / otras.length;
        const mLng = otras.reduce((t, x) => t + x.longitud, 0) / otras.length;
        const km = distKm(latitud, longitud, mLat, mLng);
        if (km > 15 && !confirm(`Esta ubicación queda a unos ${km.toFixed(1)} km del centro de las otras instituciones de ${get("distrito")}. ¿Guardar de todos modos?`)) {
          throw new Error("Guardado cancelado: revisa la coordenada.");
        }
      }
    }
    const matriculaNueva = leerMatriculaForm(f);
    const datos = {
      distrito: get("distrito"), nombre: get("nombre"), tipo: get("tipo"), codigo: get("codigo"),
      direccion: get("direccion"), zona: get("zona"), imagenes,
      director: get("director"),
      estudiantes: num("estudiantes"), docentes: num("docentes"),
      latitud, longitud, altitud: num("altitud"),
      extras, info: get("info"),
      coordsVerificadas: !!f.querySelector('input[name="coordsVerificadas"]')?.checked,
      nivel: get("nivel"), tipoIE: get("tipoIE"), gestion: get("gestion"), nroIE: get("nroIE"),
      administrativos: num("administrativos"), cas: num("cas"),
      frontera: !!f.querySelector('input[name="frontera"]')?.checked,
      jec: !!f.querySelector('input[name="jec"]')?.checked,
      personalPublico: parsePersonal(get("personalPublico")),
      subdirector: get("subdirector"), anexo: get("anexo"), condicion: get("condicion"),
      ...(matriculaNueva ? { matriculaPorNivel: matriculaNueva, estudiantes: matriculaNueva.reduce((t, m) => t + (m.matricula || 0), 0) } : {})
    };
    const id = f.dataset.id;
    if (id) {
      const existente = instituciones.find(x => x.id === id);
      if (existente && existente.coordsVerificadas && hayCambioCoords(existente, datos)) {
        const aceptar = await pedirConfirmacionCoords(existente.nombre, existente, datos);
        if (!aceptar) {
          datos.latitud = existente.latitud ?? null;
          datos.longitud = existente.longitud ?? null;
          aviso("Se conservaron las coordenadas verificadas.", true);
        }
      }
      await db.collection("instituciones").doc(id).set({ ...copiaSinId(existente || {}), ...datos });
      const cambios = [];
      if (existente) Object.keys(datos).forEach(k => {
        if (JSON.stringify(existente[k] ?? null) !== JSON.stringify(datos[k] ?? null)) cambios.push(k);
      });
      registrarHistorial("Institución", "Editada", `${datos.nombre}${cambios.length ? " — cambios: " + cambios.join(", ") : ""}`, existente ? { items: [{ id, datos: copiaSinId(existente) }] } : null);
    } else {
      await db.collection("instituciones").add(datos);
      registrarHistorial("Institución", "Creada", datos.nombre);
    }
    editando = null;
    formSucio = false;
    aviso("Institución guardada.", true);
    await cargarTodo();
  }

        await db.collection("distritos").doc(d.clave).set({ clave:d.clave, nombre:d.nombre, capital:d.capital, anexos:d.anexos, activo:!d.activo }, { merge:true });
        registrarHistorial("Distrito", d.activo ? "Ocultado" : "Mostrado", d.nombre);
        aviso(d.activo ? "Distrito ocultado." : "Distrito visible.", true);
        await cargarTodo();
      }
      else if (a === "dist-vaciar") {
        if (!confirm(`¿Vaciar los anexos de ${b.dataset.clave}?`)) return;
        await db.collection("distritos").doc(b.dataset.clave).set({ clave:b.dataset.clave, anexos:[] }, { merge:true });
        registrarHistorial("Distrito", "Anexos vaciados", b.dataset.clave);
        aviso("Anexos vaciados.", true);
        await cargarTodo();
      }
      else if (a === "dist-restaurar") {
        if (!confirm(`¿Restaurar ${b.dataset.clave} a sus datos originales?`)) return;
        await db.collection("distritos").doc(b.dataset.clave).delete();
        registrarHistorial("Distrito", "Restaurado", b.dataset.clave);
        aviso("Distrito restaurado.", true);
        await cargarTodo();
      }
      else if (a === "ie-nueva") { editando = { tipo:"ie", id:null }; pintarAdmin(); }
      else if (a === "ie-ed") { editando = { tipo:"ie", id:b.dataset.id }; pintarAdmin(); }
      else if (a === "ie-del") {
        const x = instituciones.find(i => i.id === b.dataset.id);
        if (!confirm(`¿Eliminar "${x.nombre}"?`)) return;
        await db.collection("instituciones").doc(x.id).delete();
        registrarHistorial("Institución", "Eliminada", x.nombre, { items: [respaldoDe(x.id)].filter(Boolean) });
        editando = null;
        formSucio = false;
        aviso("Institución eliminada.", true);
        await cargarTodo();
      }
      else if (a === "ie-del-masivo") {
        const ids = [...seleccionIE].filter(id => instituciones.some(x => x.id === id));
        if (!ids.length) return;
        const nombres = ids.map(id => instituciones.find(x => x.id === id).nombre);
        const muestra = nombres.slice(0, 5).join("\n• ");
        const resto = nombres.length > 5 ? `\n… y ${nombres.length - 5} más` : "";
        if (!confirm(`¿Eliminar ${ids.length} institución(es)? Esta acción no se puede deshacer.\n\n• ${muestra}${resto}`)) return;
        for (let i = 0; i < ids.length; i += 450) {
          const batch = db.batch();
          ids.slice(i, i + 450).forEach(id => batch.delete(db.collection("instituciones").doc(id)));
          await batch.commit();
        }
        registrarHistorial("Institución", "Eliminadas en lote", `${ids.length} instituciones: ${nombres.slice(0, 8).join("; ")}${nombres.length > 8 ? "…" : ""}`, { items: ids.map(respaldoDe).filter(Boolean) });
        seleccionIE.clear();
        aviso(`${ids.length} institución(es) eliminada(s).`, true);
        await cargarTodo();
      }
      else if (a === "ie-carga-inicial") {
        if (instituciones.length) { aviso("La colección ya tiene instituciones; no se cargó nada."); return; }
        if (!confirm("¿Cargar las instituciones iniciales (Aplao y datos de prueba)?")) return;
        const batch = db.batch();
        IE_INICIALES.forEach(x => batch.set(db.collection("instituciones").doc(), x));
        await batch.commit();
        registrarHistorial("Instituciones", "Carga inicial", `${IE_INICIALES.length} instituciones`);
        aviso("Datos iniciales cargados.", true);
        await cargarTodo();
      }
      else if (a === "extra-add") {
        const cont = $("extras");
        if (cont) cont.insertAdjacentHTML("beforeend", filaExtra());
      }
      else if (a === "extra-del") b.closest(".fila-extra")?.remove();
      else if (a === "plantilla") descargarPlantilla();
      else if (a === "ie-verificar-sel") {
        const ids = [...seleccionIE];
        if (!ids.length) { aviso("Selecciona primero las instituciones en la tabla."); return; }
        if (!confirm(`¿Marcar ${ids.length} institución(es) como verificadas? Sus coordenadas pedirán confirmación antes de cambiar.`)) return;
        const batch = db.batch();
        ids.forEach(id => batch.update(db.collection("instituciones").doc(id), { coordsVerificadas: true }));
        await batch.commit();
        registrarHistorial("Institución", "Coordenadas verificadas en lote", `${ids.length} instituciones`, { items: ids.map(respaldoDe).filter(Boolean) });
        seleccionIE.clear();
        aviso(`${ids.length} institución(es) marcadas como verificadas.`, true);
        await cargarTodo();
      }
      else if (a === "ie-desverificar-sel") await cambiarVerificacion([...seleccionIE], false);
      else if (a === "ver-pend") {
        setTab("instituciones");
        const sel = $("fPend");
        if (sel) { sel.value = b.dataset.pend; pintarListaIE(); }
      }
      else if (a === "hist-deshacer") {
        const h = historial.find(x => x.id === b.dataset.hid);
        if (!h || !h.respaldo) return;
        if (!confirm(`¿Deshacer este cambio?\n\n${h.accion}: ${h.detalle}`)) return;
        await deshacerCambio(h);
      }
      else if (a === "foto-url") {
        const campo = $("fotoUrl");
        const url = (campo?.value || "").trim();
        if (!/^https?:\/\/\S+$/i.test(url)) { aviso("Escribe una dirección que empiece con http:// o https://"); return; }
        agregarFotoUrl(url);
        campo.value = "";
        formSucio = true;
      }
      else if (a === "foto-quitar") quitarFotoPorIndice(Number(b.dataset.i));
      else if (a === "ie-exportar") await exportarTodo();
      else if (a === "ie-sugerir-anexo") await sugerirAnexos();
      else if (a === "pers-vis-filtro") await cambiarVisibilidad(filtradosPersonal().map(x => x.id), b.dataset.v === "1");
      else if (a === "pers-limpiar") await limpiarPersonalRepetido();
      else if (a === "pers-verificar") await verificarRepetidosPersonal();
      else if (a === "pers-del") await eliminarPersonal(b.dataset.id);
      else if (a === "vista-ie") { vistaIE = b.dataset.v; pintarAdmin(); }
      else if (a === "pers-migrar") {
        const ids = (personalCache || []).filter(x => x.publico === undefined).map(x => x.id);
        if (!ids.length) { aviso("Todos los registros ya tienen su marca de visibilidad.", true); return; }
        await cambiarVisibilidad(ids, true);
      }
      else if (a === "det-agregar") {
        const cuerpo = document.querySelector(`[data-det-body="${b.dataset.ni}"]`);
        if (cuerpo) cuerpo.insertAdjacentHTML("beforeend", filaDetalle({ grado: "", hombres: 0, mujeres: 0 }));
      }
      else if (a === "det-quitar") b.closest("tr.fila-det")?.remove();
      else if (a === "portada-guardar") await guardarPortada();
      else if (a === "portada-restaurar") {
        if (!confirm("¿Restaurar la portada a sus valores originales? Se perderán los cambios guardados.")) return;
        portadaCfg = { ...PORTADA_DEFAULT };
        pintarLogoTop();
        await db.collection("config").doc("portada").set(PORTADA_DEFAULT);
        aviso("Portada restaurada.", true);
        pintarAdmin();
      }
      else if (a === "ie-duplicados") await limpiarDuplicados();
      else if (a === "excel-aplicar") await aplicarImportacion();
      else if (a === "excel-cancelar") { plan = null; $("planBox").innerHTML = ""; aviso("Importación cancelada."); }
    } catch (err) {
      aviso("Error: " + err.message);
    }
  });

  $("adB").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target;
    try {
      if (f.dataset.form === "dist") await guardarDistrito(f);
      else if (f.dataset.form === "ie") await guardarInstitucion(f);
    } catch (err) {
      aviso("Error al guardar: " + err.message);
    }
  });

  $("adB").addEventListener("input", e => {
    if (e.target.id === "fBuscar") pintarListaIE();
    if (e.target.id === "pBuscar") pintarPersonal();
    if (e.target.matches(".fila-det input[data-h], .fila-det input[data-m]")) recalcularFila(e.target);
    if (e.target.matches("textarea[data-fotos]")) pintarMiniaturas();
    if (e.target.closest("form[data-form]")) formSucio = true;
  });

  window.addEventListener("beforeunload", e => {
    if (formSucio) { e.preventDefault(); e.returnValue = ""; }
  });

  $("adB").addEventListener("change", async e => {
    if (e.target.id === "portadaLogoArchivo" || e.target.id === "portadaFondoArchivo") {
      const f = e.target.files[0];
      e.target.value = "";
      if (!f) return;
      aviso("Subiendo imagen…", true);
      try {
        const url = await subirFoto(f);
        const campo = document.querySelector(e.target.id === "portadaLogoArchivo" ? 'input[name="logo"]' : 'input[name="fondo"]');
        if (campo) campo.value = url;
        aviso("Imagen subida. Guarda la portada para publicarla.", true);
      } catch (err) {
        aviso("No se pudo subir la imagen: " + err.message);
      }
      return;
    }
    if (e.target.id === "archivoPersonal") {
      const f = e.target.files[0];
      e.target.value = "";
      if (!f) return;
      aviso("Leyendo docentes del Excel…", true);
      try {
        plan = await analizarAuto(f);
        tab = "excel";
        editando = null;
        pintarAdmin();
        mostrarPlan();
        aviso("Revisa la vista previa y pulsa “Aplicar importación”.", true);
      } catch (err) {
        plan = null;
        aviso("No se pudo leer el archivo: " + err.message);
      }
      return;
    }
    if (e.target.id === "fotoArchivo") {
      const files = e.target.files;
      if (files && files.length) await subirFotosSeleccionadas(files);
      e.target.value = "";
      return;
    }
    if (e.target.classList?.contains("chk-ie")) {
      const id = e.target.dataset.id;
      if (e.target.checked) seleccionIE.add(id); else seleccionIE.delete(id);
      actualizarSeleccionUI();
      return;
    }
    if (e.target.id === "chkTodos") {
      idsVisiblesIE.forEach(id => e.target.checked ? seleccionIE.add(id) : seleccionIE.delete(id));
      document.querySelectorAll(".chk-ie").forEach(c => { c.checked = seleccionIE.has(c.dataset.id); });
      actualizarSeleccionUI();
      return;
    }
    if (e.target.closest("form[data-form]")) formSucio = true;
    if (e.target.id === "fDist" || e.target.id === "fPend" || e.target.id === "fAnexo") pintarListaIE();
    if (e.target.id === "pDist") pintarPersonal();
    if (e.target.dataset && e.target.dataset.pub !== undefined) await cambiarVisibilidad([e.target.dataset.pub], e.target.checked);
    if (e.target.id === "archivoExcel") {
      const f = e.target.files[0];
      if (!f) return;
      aviso("Leyendo archivo…", true);
      try {
        plan = await analizarAuto(f);
        mostrarPlan();
        aviso("Revisa la vista previa antes de aplicar.", true);
      } catch (err) {
        plan = null;
        aviso("No se pudo leer el archivo: " + err.message);
      }
      e.target.value = "";
    }
  });

  cargarTodo();
  cargarPortadaAdm();
</script>
</body>
</html>
