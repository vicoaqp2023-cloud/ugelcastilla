  // Búsqueda aproximada sobre varios campos (ignora acentos y tolera un error por palabra).
  function coincideBusqueda(campos, q) {
    const norm = s => sinTildes(s).replace(/[^a-z0-9]+/g, " ").trim();
    const tokens = norm(q).split(" ").filter(Boolean);
    if (!tokens.length) return true;
    const texto = norm(campos.map(c => c ?? "").join(" "));
    const palabras = texto.split(" ").filter(Boolean);
    return tokens.every(tk => texto.includes(tk) || palabras.some(w => tk.length >= 4 && distEdPub(w.slice(0, tk.length + 1), tk) <= 1));
  }

  // Agrupa las instituciones del distrito por anexo: primero la sede principal y luego cada anexo.
  function pintarGruposDistrito() {
    const cont = document.getElementById("gruposDist");
    const top = estado.pila[estado.pila.length - 1];
    if (!cont || !top || top.tipo !== "distrito") return;
    const d = distritos.find(x => x.clave === top.clave);
    const q = (estado.dq || "").trim();
    const idx = todas.map((_, i) => i).filter(i => todas[i].distrito === top.clave);
    if (!idx.length) { cont.innerHTML = `<p class="vacio">Sin instituciones cargadas.</p>`; return; }
    const visibles = idx.filter(i => !q || coincideBusqueda([todas[i].nombre, todas[i].tipo, todas[i].nivel, todas[i].direccion,
      todas[i].director, todas[i].subdirector, todas[i].anexo, todas[i].gestion, todas[i].zona, todas[i].distrito], q));
    if (!visibles.length) { cont.innerHTML = `<p class="estado">No hay instituciones que coincidan con la búsqueda.</p>`; return; }
    const grupos = [{ nombre: "Sede principal", items: [] }, ...d.anexos.map(a => ({ nombre: a, items: [] }))];
    visibles.forEach(i => {
      const a = (todas[i].anexo || "").trim();
      let g = a ? grupos.find(x => sinTildes(x.nombre) === sinTildes(a)) : grupos[0];
      if (!g) { g = { nombre: a, items: [] }; grupos.push(g); }
      g.items.push(i);
    });
    cont.innerHTML = grupos.filter(g => g.items.length).map(g => `
      <h3 class="sub-h grupo-anexo">${esc(g.nombre)} <span class="cant-g">${g.items.length}</span></h3>
      <div class="grid-ie">${g.items.map(ieCard).join("")}</div>`).join("");
  }

  function pintar() {
    const v = estado.pila[estado.pila.length - 1];
    if (mapaLeaflet && v.tipo !== "mapa") { mapaLeaflet.remove(); mapaLeaflet = null; marcadoresMapa = {}; }
    if (v.tipo === "home") app.innerHTML = vistaHome();
    else if (v.tipo === "distrito") app.innerHTML = vistaDistrito(v.clave);
    else if (v.tipo === "mapa") { app.innerHTML = vistaMapa(); iniciarMapa(); }
    else app.innerHTML = vistaFicha(v.i);
    if (v.tipo === "home") pintarResultados();
    if (v.tipo === "distrito") pintarGruposDistrito();
    window.scrollTo(0, 0);
  }

  function ir(vista) {
    estado.pila.push(vista);
    estado.foto = 0;
    if (vista.tipo === "distrito") estado.dq = "";
    pintar();
  }

  function volver() {
    if (estado.pila.length > 1) estado.pila.pop();
    estado.foto = 0;
    pintar();

  const PORTADA_DEFAULT = {
    logo: "", fondo: "", fondoOpacidad: 70, altura: 520,
    colorPrincipal: "#0f321e", colorAcento: "#c8a34b",
    eyebrow: "Municipalidad Provincial de Castilla · Aplao",
    titulo: "Directorio de instituciones educativas",
    subtitulo: "Consulta las instituciones de la provincia de Castilla: ubicación, datos, personal y anexos.",
    boton1Texto: "Ver mapa de instituciones", boton1Accion: "mapa", boton1Url: "",

    mostrarBotones: true
  };
  (function ponerIcono() {
    const l = document.createElement("link"); l.rel = "icon"; l.href = LOGO_DEFAULT; document.head.appendChild(l);
  })();
  function botonPortada(cfg, n) {
    const texto = cfg[`boton${n}Texto`];
    if (!texto) return "";
    return `<button type="button" class="btn-p${n}" data-pa="${esc(cfg[`boton${n}Accion`])}" data-url="${esc(cfg[`boton${n}Url`] || "")}">${esc(texto)}</button>`;
  }
  function renderPortada(c) {
    const cfg = { ...PORTADA_DEFAULT, ...(c || {}) };
    const st = document.documentElement.style;
    st.setProperty("--p-principal", cfg.colorPrincipal);
    st.setProperty("--p-acento", cfg.colorAcento);
    const h = document.getElementById("portada");
    h.style.minHeight = cfg.altura + "px";
    const fondo = cfg.fondo ? `background-image:url('${cssUrl(cfg.fondo)}')` : "";
    h.innerHTML = `
      <div class="portada-fondo" style="${fondo}"></div>
      <div class="portada-velo" style="opacity:${Math.min(1, Math.max(0, cfg.fondoOpacidad / 100))}"></div>
      <div class="portada-contenido">
        <div class="logo-ugel"><img src="${esc(cfg.logo || LOGO_DEFAULT)}" alt="Logo UGEL Castilla"></div>
        ${cfg.eyebrow ? `<span class="eyebrow">${esc(cfg.eyebrow)}</span>` : ""}
        <h1>${esc(cfg.titulo)}</h1>
        ${cfg.subtitulo ? `<p>${esc(cfg.subtitulo)}</p>` : ""}
        ${cfg.mostrarBotones ? `<div class="botones-portada">${botonPortada(cfg, 1)}${botonPortada(cfg, 2)}</div>` : ""}
      </div>`;
  }
  let dbPortada = null;
  async function cargarPortada() {
    try {
      if (!db) { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
      const doc = await db.collection("config").doc("portada").get();
      renderPortada(doc.exists ? doc.data() : null);
    } catch (e) {
      renderPortada(null);
    }
  }
  document.getElementById("portada").addEventListener("click", e => {
    const b = e.target.closest("button[data-pa]");
    if (!b) return;
    const acc = b.dataset.pa;
    if (acc === "mapa") { if (estado.pila[estado.pila.length - 1].tipo !== "mapa") ir({ tipo:"mapa" }); }
    else if (acc === "distritos") {
      estado.pila = [{ tipo:"home" }]; estado.foto = 0; pintar();
      document.getElementById("buscar")?.scrollIntoView({ behavior:"smooth", block:"center" });
    }
    else if (acc === "url" && b.dataset.url) window.open(b.dataset.url, "_blank", "noopener");
  });

  // ---------- Barra superior ----------
  document.getElementById("barraPub").addEventListener("click", e => {
    const b = e.target.closest("button[data-nav]");
    if (!b) return;
    const accion = b.dataset.nav;
    document.querySelectorAll("#barraPub button").forEach(x => x.classList.toggle("on", x === b));
    if (accion === "inicio") { estado.pila = [{ tipo:"home" }]; estado.foto = 0; pintar(); }
    else if (accion === "mapa") { if (estado.pila[estado.pila.length - 1].tipo !== "mapa") ir({ tipo:"mapa" }); }
    else if (accion === "actualizar") { fuente = "Actualizando…"; pintar(); cargarDatos(); cargarPortada(); }
  });

    document.getElementById("formLogin").hidden = false;
    document.getElementById("loginOk").hidden = true;
    document.getElementById("loginMsg").textContent = "";
    document.getElementById("loginClave").value = "";
    modal.hidden = false;
    document.getElementById("loginUsuario").focus();
  };
  const cerrarLogin = () => { modal.hidden = true; };
  document.getElementById("btnUsuarios").addEventListener("click", abrirLogin);
  document.getElementById("loginCerrar").addEventListener("click", cerrarLogin);
  document.getElementById("loginSalir").addEventListener("click", cerrarLogin);
  modal.addEventListener("click", e => { if (e.target === modal) cerrarLogin(); });
  const intentarEntrar = () => {
    const usuario = document.getElementById("loginUsuario").value.trim().toLowerCase();
    const clave = document.getElementById("loginClave").value;
    if (usuario === CREDENCIALES.usuario && clave === CREDENCIALES.clave) {
      window.location.href = ADMIN_URL;
    } else {
      document.getElementById("loginMsg").textContent = "Usuario o contraseña incorrectos.";
    }
  };
  document.getElementById("loginEntrar").addEventListener("click", intentarEntrar);
  document.getElementById("loginClave").addEventListener("keydown", e => { if (e.key === "Enter") intentarEntrar(); });

  // ---------- Eventos (delegación: funcionan aunque la vista cambie) ----------
  app.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-volver")) return volver();
    if (b.hasAttribute("data-mapa")) return ir({ tipo:"mapa" });
    if (b.hasAttribute("data-ver-todas")) return verTodasMapa();
    if (b.hasAttribute("data-refrescar")) { fuente = "Actualizando…"; pintar(); cargarDatos(); return; }
    if (b.dataset.m !== undefined) return enfocarMapa(Number(b.dataset.m));
    if (b.dataset.d !== undefined) return ir({ tipo:"distrito", clave:b.dataset.d });
    if (b.dataset.ie !== undefined) return ir({ tipo:"ficha", i:Number(b.dataset.ie) });
    if (b.dataset.cnav !== undefined || b.dataset.cdot !== undefined) {
      const cont = document.getElementById("cuadros");
      if (cont) {
        const ancho = cont.querySelector(".cuadro").offsetWidth + 16;
        if (b.dataset.cnav !== undefined) cont.scrollBy({ left: Number(b.dataset.cnav) * ancho, behavior: "smooth" });
        else cont.scrollTo({ left: Number(b.dataset.cdot) * ancho, behavior: "smooth" });
      }
      return;
    }
    if (b.dataset.foto !== undefined) { estado.foto = Number(b.dataset.foto); pintar(); }
  });

  function aplicarNominal() {
    const q = sinTildes(document.querySelector("[data-nominal]")?.value || "").trim();
    const cat = document.querySelector("[data-nominal-cat]")?.value || "";
    const filas = document.querySelectorAll(".tabla-nominal tbody tr");
    let vis = 0;
    filas.forEach(tr => {
      const ok = (!q || tr.dataset.txt.includes(q)) && (!cat || tr.dataset.cat === cat);
      tr.hidden = !ok;
      if (ok) vis++;
    });
    const c = document.getElementById("nominalConteo");
    if (c) c.textContent = `${vis} de ${filas.length}`;
  }
  app.addEventListener("change", e => { if (e.target.matches("[data-nominal-cat]")) aplicarNominal(); });
  app.addEventListener("input", e => {
    if (!e.target.matches("[data-nominal]")) return;
    aplicarNominal();
  });
  app.addEventListener("scroll", e => {
    if (e.target.id !== "cuadros") return;
    const c = e.target;
    const ancho = c.querySelector(".cuadro").offsetWidth + 16;
    const idx = Math.min(4, Math.round(c.scrollLeft / ancho));
    document.querySelectorAll("[data-cdot]").forEach((b, i) => b.classList.toggle("on", i === idx));
  }, true);
  app.addEventListener("change", e => {
    if (e.target.id === "filtroAnexo") { estado.anexo = e.target.value; pintarResultados(); }
  });
  app.addEventListener("input", e => {
    if (e.target.id === "buscar") { estado.q = e.target.value; pintarResultados(); }
    if (e.target.id === "mFiltro") pintarListaMapa();
    if (e.target.id === "buscarDist") { estado.dq = e.target.value; pintarGruposDistrito(); }
  });

  // ---------- Mapa de instituciones (mismo diseño que el mapa de la UGEL) ----------
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
  const sinTildes = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  function distEdPub(a, b) {
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  // Coincidencia aproximada: ignora acentos y tolera un error de escritura por palabra.
  function coincideBusquedaPub(ie, q) {
    const norm = s => sinTildes(s).replace(/[^a-z0-9]+/g, " ").trim();
    const tokens = norm(q).split(" ").filter(Boolean);
    if (!tokens.length) return false;
    const texto = norm([ie.nombre, ie.tipo, ie.direccion, ie.distrito, ie.anexo, ie.nivel, ie.director, ie.gestion, ie.zona].join(" "));
    const palabras = texto.split(" ").filter(Boolean);
    return tokens.every(t => texto.includes(t) || palabras.some(w => t.length >= 4 && distEdPub(w.slice(0, t.length + 1), t) <= 1));
  }
  const esFicticia = ie => /ficticia|ficticio/i.test(`${ie.nombre} ${ie.tipo || ""}`);
  const $ = id => document.getElementById(id);

  let mapaLeaflet = null;
  let marcadoresMapa = {};
  let mapaSel = null;

  // Coordenadas guardadas en la base de datos (latitud y longitud).
  function ubicacionDe(ie) {
    return (typeof ie.latitud === "number" && typeof ie.longitud === "number")
      ? { lat: ie.latitud, lng: ie.longitud } : null;
  }
  function itemsLista() {
    return todas.map((ie, i) => ({ ie, i, u: ubicacionDe(ie) })).filter(x => !esFicticia(x.ie));
  }
  function mapaItems() { return itemsLista().filter(x => x.u); }

  function vistaMapa() {
    const reales = itemsLista();
    const conUbi = reales.filter(x => x.u).length;
    return `
      <button type="button" class="volver" data-volver>← Volver</button>
      <div class="acciones-home">
        <button type="button" class="ver-mapa" style="background:#1e5b8f" data-refrescar>↻ Actualizar datos</button>
        <button type="button" class="ver-mapa" style="background:#0f766e" data-ver-todas>Ver todas en el mapa</button>
      </div>
      <h1 class="titulo">Mapa de instituciones</h1>
      <p class="sub">${reales.length} instituciones · ${conUbi} con ubicación en el mapa. Haz clic en un pin o en la lista.</p>
      <div class="mapa-layout">
        <aside class="mapa-lista">
          <input id="mFiltro" class="buscador" type="search" placeholder="Buscar institución o distrito…">
          <div id="mLista"></div>
        </aside>
        <div class="mapa-wrap"><div id="mapa"></div></div>
      </div>`;
  }

  function pinIcon() {
    return L.divIcon({
      className: "pin-rojo",
      html: `<svg width="34" height="46" viewBox="0 0 34 46" xmlns="http://www.w3.org/2000/svg">
               <path d="M17 1C8.2 1 1 8.2 1 17c0 12 16 28 16 28s16-16 16-28C33 8.2 25.8 1 17 1z" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/>
               <circle cx="17" cy="17" r="6.5" fill="#7a1a14"/></svg>`,
      iconSize: [34, 46], iconAnchor: [17, 45], popupAnchor: [0, -42]
    });
  }

  function tarjetaMapa(ie, i, u) {
    const p = portadaDe(ie);
    const foto = p
      ? `<img class="pop-foto" src="${esc(p)}" alt="" onerror="this.outerHTML='<div class=&quot;pop-foto pop-sin&quot;>Sin foto</div>'">`
      : `<div class="pop-foto pop-sin">Sin foto</div>`;
    return `<div class="pop">${foto}
      <div class="pop-t">${esc(ie.nombre)}</div>
      <div class="pop-l">${esc(ie.tipo || "Sin tipo")}</div>
      <div class="pop-l">🏫 Distrito de ${esc(ie.distrito)}${ie.zona ? " · " + esc(ie.zona) : ""}</div>
      <div class="pop-l">👤 Director: ${esc(ie.director || "por registrar")}</div>
      <div class="pop-l">📍 ${u.lat.toFixed(6)}, ${u.lng.toFixed(6)}</div>
      <div class="pop-b">
        <a href="https://www.google.com/maps?q=${u.lat},${u.lng}" target="_blank" rel="noopener">Ver en Google Maps</a>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${u.lat},${u.lng}" target="_blank" rel="noopener">Cómo llegar</a>
        <button type="button" data-ie="${i}">Ficha completa</button>
      </div></div>`;
  }

  // Nombre sobre cada pin, siempre visible.
  function etiquetar() {
    if (!mapaLeaflet) return;
    Object.entries(marcadoresMapa).forEach(([i, m]) => {
      m.unbindTooltip();
      m.bindTooltip(todas[i].nombre, { permanent:true, direction:"right", offset:[10, -18], className:"etiq-ie" });
    });
  }

  function dibujarPinesMapa() {
    const items = mapaItems();
    items.forEach(({ ie, i, u }) => {
      marcadoresMapa[i] = L.marker([u.lat, u.lng], { icon: pinIcon(), title: ie.nombre })
        .addTo(mapaLeaflet)
        .bindPopup(tarjetaMapa(ie, i, u), { maxWidth:280, minWidth:230 })
        .on("popupopen", e => {
          const b = e.popup.getElement()?.querySelector("button[data-ie]");
          if (b) b.onclick = () => ir({ tipo:"ficha", i });
        })
        .on("click", () => { mapaSel = i; pintarListaMapa(); });
    });
    etiquetar();
    verTodasMapa();
  }

  function verTodasMapa() {
    if (!mapaLeaflet) return;
    const pts = mapaItems().map(x => [x.u.lat, x.u.lng]);
    if (!pts.length) return;
    if (pts.length === 1) mapaLeaflet.setView(pts[0], 17);
    else mapaLeaflet.fitBounds(pts, { padding:[60, 60], maxZoom:17 });
  }

  function pintarListaMapa() {
    const cont = $("mLista");
    if (!cont) return;
    const f = sinTildes($("mFiltro")?.value || "").trim();
    const items = itemsLista().filter(x => !f || sinTildes(x.ie.nombre).includes(f) || sinTildes(x.ie.distrito).includes(f));
    cont.innerHTML = items.length
      ? items.map(x => {
          const detalle = `<span>${esc(x.ie.distrito)} · ${esc(x.ie.tipo || "")}</span>`;
          if (x.u) {
            const act = x.i === mapaSel ? " activo" : "";
            return `<button type="button" class="mitem${act}" data-m="${x.i}"><strong>${esc(x.ie.nombre)}</strong>${detalle}<span>📍 En el mapa</span></button>`;
          }
          return `<button type="button" class="mitem sin-ubi" data-ie="${x.i}"><strong>${esc(x.ie.nombre)}</strong>${detalle}<span>⚠️ Sin coordenadas · ver ficha</span></button>`;
        }).join("")
      : `<p class="vacio">No hay instituciones para esa búsqueda.</p>`;
  }

  function enfocarMapa(i) {
    const m = marcadoresMapa[i];
    if (!m || !mapaLeaflet) return;
    mapaSel = i;
    pintarListaMapa();
    const destino = m.getLatLng();
    if (mapaLeaflet.getCenter().distanceTo(destino) < 1 && mapaLeaflet.getZoom() >= 17) { m.openPopup(); return; }
    mapaLeaflet.once("moveend", () => m.openPopup());
    mapaLeaflet.flyTo(destino, Math.max(mapaLeaflet.getZoom(), 17), { duration:0.6 });
  }

  function iniciarMapa() {
    const cont = $("mapa");
    if (!cont) return;
    if (typeof L === "undefined") { cont.innerHTML = '<p class="vacio" style="padding:20px">No se pudo cargar el mapa.</p>'; return; }
    const satelite = L.layerGroup([
      L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, maxNativeZoom:16, attribution:"Tiles © Esri" }),
      L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, maxNativeZoom:16 })
    ]);
    const calles = L.tileLayer(ESRI + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, maxNativeZoom:16, attribution:"Tiles © Esri" });
    mapaLeaflet = L.map("mapa", { layers:[satelite], maxZoom:19 }).setView([-16.0745, -72.4925], 16);
    L.control.layers({ "Satélite": satelite, "Calles": calles }, null, { position:"topright" }).addTo(mapaLeaflet);
    mapaLeaflet.on("zoomend", etiquetar);
    dibujarPinesMapa();
    pintarListaMapa();
    setTimeout(() => mapaLeaflet && mapaLeaflet.invalidateSize(), 150);
  }

  // ---------- Carga de datos ----------
  function armarDistritos(guardados) {
    return DISTRITOS_BASE.map(b => {
      const g = guardados[b.clave];
      return g ? { clave:b.clave, nombre:g.nombre ?? b.nombre, capital:g.capital ?? b.capital,
                   anexos:[...new Set([...b.anexos, ...(g.anexos || [])])], activo:g.activo ?? true }
               : { ...b, activo:true };
    });
  }

  function usarRespaldo(motivo) {
    todas = [];
    distritos = armarDistritos({});
    fuente = "Sin conexión con la base de datos (" + motivo + ")";
    pintar();
  }

  let db = null;
  function cargarDatos() {
    try {
      if (!db) { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
      Promise.all([db.collection("distritos").get(), db.collection("instituciones").get(), db.collection("personal").where("publico", "==", true).get().catch(() => null)])
        .then(([sd, si, sp]) => {
          personalVisible = sp ? sp.docs.map(d => d.data()).sort((a, b) => String(a.cargo).localeCompare(String(b.cargo), "es")) : [];
          const guardados = {};
          sd.forEach(doc => guardados[doc.id] = doc.data());
          distritos = armarDistritos(guardados);
          if (si.empty) { usarRespaldo("sin registros en la base"); return; }
          todas = ordenarIE(si.docs.map(d => ({ id:d.id, ...d.data() })));
          fuente = "Datos en línea";
          pintar();
        })
        .catch(() => {
          if (todas.length) { fuente = "Sin conexión: datos anteriores"; pintar(); }
          else usarRespaldo("sin conexión con la base");
        });
    } catch (e) {
      usarRespaldo("error de configuración");
    }
  }

  cargarDatos();

  renderPortada(null);
  cargarPortada();
</script>
</body>
